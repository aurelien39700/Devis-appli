<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04070A">
<title>Somepre Atelier</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="img/favicon-64.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ============================================================
   SOMEPRE ATELIER — le parcours simplifié, sur les vraies données
   Trois destinations : Pointage · Affaires · Gestion.
   L'affaire est le centre : devis, heures, conditions et synthèse
   sur une seule fiche, portée par un seul cycle
   Brouillon → Envoyé → En cours → Terminée.
   La logique vit dans atelier.js ; l'ancienne interface
   (index.html) reste intacte et sert de secours.
   ============================================================ */
:root{
  --ground:#04070A; --panel:#0C1319; --panel-2:#151F27; --panel-3:#1F2C36;
  --line:#33444F; --line-soft:#22303A;
  --ink:#FFFFFF; --ink-mid:#C4D2DC; --ink-dim:#8FA2AF;
  --arc:#4DA6FF; --on-arc:#04121F;
  --arc-soft:rgba(77,166,255,.16); --arc-line:rgba(77,166,255,.6);
  --m-reel:#3A93E0; --m-reel-soft:rgba(58,147,224,.15);
  --m-bud:#C08420;  --m-bud-soft:rgba(192,132,32,.15); --m-bud-ink:#E0A54A;
  --ok:#2FD07A; --ok-soft:rgba(47,208,122,.15);
  --stop:#FF5E52; --stop-soft:rgba(255,94,82,.15);
  --wait:#B18CFF; --wait-soft:rgba(177,140,255,.15);
  --idle:#8797A2; --idle-soft:rgba(135,151,162,.15);
  --shadow:0 18px 44px -20px rgba(0,0,0,.95);
  --scrim:rgba(2,4,6,.8);
  --f-display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-ui:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-data:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  --rail-w:238px; --r-sm:5px; --r-md:8px; --r-lg:12px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#E9EDF2; --panel:#FFFFFF; --panel-2:#F2F5F9; --panel-3:#E2E8EF;
    --line:#A7B4C0; --line-soft:#D5DCE4;
    --ink:#06090D; --ink-mid:#37424D; --ink-dim:#55616C;
    --arc:#0A5FC0; --on-arc:#FFFFFF;
    --arc-soft:rgba(10,95,192,.12); --arc-line:rgba(10,95,192,.5);
    --m-reel:#0A5FC0; --m-reel-soft:rgba(10,95,192,.12);
    --m-bud:#9A6207;  --m-bud-soft:rgba(154,98,7,.13); --m-bud-ink:#7A4E05;
    --ok:#0B7A42; --ok-soft:rgba(11,122,66,.12);
    --stop:#B01C12; --stop-soft:rgba(176,28,18,.12);
    --wait:#6A35C9; --wait-soft:rgba(106,53,201,.12);
    --idle:#55616C; --idle-soft:rgba(85,97,108,.13);
    --shadow:0 16px 36px -20px rgba(10,20,35,.35);
    --scrim:rgba(233,237,242,.82);
  }
}
:root[data-theme="light"]{
  --ground:#E9EDF2; --panel:#FFFFFF; --panel-2:#F2F5F9; --panel-3:#E2E8EF;
  --line:#A7B4C0; --line-soft:#D5DCE4;
  --ink:#06090D; --ink-mid:#37424D; --ink-dim:#55616C;
  --arc:#0A5FC0; --on-arc:#FFFFFF;
  --arc-soft:rgba(10,95,192,.12); --arc-line:rgba(10,95,192,.5);
  --m-reel:#0A5FC0; --m-reel-soft:rgba(10,95,192,.12);
  --m-bud:#9A6207;  --m-bud-soft:rgba(154,98,7,.13); --m-bud-ink:#7A4E05;
  --ok:#0B7A42; --ok-soft:rgba(11,122,66,.12);
  --stop:#B01C12; --stop-soft:rgba(176,28,18,.12);
  --wait:#6A35C9; --wait-soft:rgba(106,53,201,.12);
  --idle:#55616C; --idle-soft:rgba(85,97,108,.13);
  --shadow:0 16px 36px -20px rgba(10,20,35,.35);
  --scrim:rgba(233,237,242,.82);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,select,textarea{font:inherit;}
:focus-visible{outline:2px solid var(--arc);outline-offset:2px;border-radius:var(--r-sm);}
h1,h2,h3{margin:0;font-family:var(--f-display);letter-spacing:-.03em;text-wrap:balance;}
.eyebrow{font-family:var(--f-data);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);}
.hidden{display:none !important;}
@keyframes rise{from{opacity:0;transform:translateY(13px);}to{opacity:1;transform:none;}}
@keyframes pulse{0%,100%{opacity:1;transform:rotate(45deg) scale(1);}50%{opacity:.6;transform:rotate(45deg) scale(.85);}}
/* Logo Somépré : l'image sert de masque, la couleur suit le thème */
.logo-somepre{display:block;aspect-ratio:1842/356;background:var(--ink);
  -webkit-mask:url(img/logo-mot.png) center/contain no-repeat;mask:url(img/logo-mot.png) center/contain no-repeat;}
.topbar-logo{display:none;width:92px;flex:none;}
.mark{flex:none;width:34px;height:34px;border:1.5px solid var(--arc);border-radius:var(--r-sm);display:grid;place-items:center;}
.mark::before{content:'';width:12px;height:12px;background:var(--arc);border-radius:2px;transform:rotate(45deg);box-shadow:0 0 14px var(--arc-line);animation:pulse 3.4s ease-in-out infinite;}

/* ============================================================ connexion */
#ecranConnexion{min-height:100vh;display:grid;place-items:center;padding:24px;}
.connexion{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px;box-shadow:var(--shadow);}
.connexion-marque{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:26px;text-align:center;}
.connexion-marque h1{font-size:22px;font-weight:800;}
.connexion-marque .logo-somepre{width:min(250px,80%);}
.connexion-slogan{font-size:12px;color:var(--ink-dim);line-height:1.4;max-width:260px;}
.types{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:20px;}
.types button{padding:13px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--panel-2);color:var(--ink-mid);font-size:13.5px;font-weight:600;transition:background .18s,color .18s,border-color .18s;}
.types button.is-on{background:var(--arc-soft);border-color:var(--arc);color:var(--arc);}
.champ{display:flex;flex-direction:column;gap:6px;margin-bottom:15px;}
.champ label{font-family:var(--f-data);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);}
.champ input,.champ select,.champ textarea{padding:11px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:14.5px;transition:border-color .18s;}
.champ textarea{min-height:72px;resize:vertical;font-family:inherit;}
.champ input:focus,.champ select:focus,.champ textarea:focus{border-color:var(--arc);outline:none;}
.champ input::placeholder,.champ textarea::placeholder{color:var(--ink-dim);}
.erreur{display:none;margin-top:12px;padding:10px 12px;border-radius:var(--r-md);background:var(--stop-soft);border:1px solid var(--stop);color:var(--stop);font-size:13px;}
.erreur.show{display:block;}

/* ============================================================ ossature */
#ecranApp{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100vh;}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);}
.brand{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:7px;padding:19px 20px;border-bottom:1px solid var(--line-soft);min-height:74px;}
.brand-nom{font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;}
.brand-sous{font-family:var(--f-data);font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--ink-dim);}
.nav{flex:1;padding:16px 0;}
.nav-item{display:flex;align-items:center;gap:13px;width:100%;padding:12px 18px;color:var(--ink-mid);text-align:left;transition:color .18s,background .18s;border-left:3px solid transparent;}
.nav-item svg{flex:none;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.nav-item span{font-size:15px;font-weight:600;}
.nav-item:hover{background:var(--panel-2);color:var(--ink);}
.nav-item.is-on{color:var(--ink);background:var(--arc-soft);border-left-color:var(--arc);}
.nav-item.is-on svg{color:var(--arc);}
.nav-badge{margin-left:auto;font-family:var(--f-data);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--panel-3);color:var(--ink-mid);border:1px solid var(--line);}
.rail-foot{border-top:1px solid var(--line-soft);padding:13px 17px 16px;display:flex;flex-direction:column;gap:10px;}
.sync-etat{display:flex;align-items:center;gap:8px;font-family:var(--f-data);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ok);white-space:nowrap;}
.sync-etat::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;}
.sync-etat.hors{color:var(--stop);}
.operator{display:flex;align-items:center;gap:10px;}
.avatar{flex:none;width:30px;height:30px;border-radius:var(--r-sm);background:var(--panel-3);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-data);font-size:11px;font-weight:700;color:var(--arc);}
.op-nom{font-size:13.5px;font-weight:600;line-height:1.2;}
.op-role{font-family:var(--f-data);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);}
.deconnexion{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-dim);padding:6px 0;transition:color .18s;}
.deconnexion:hover{color:var(--stop);}

.stage{display:flex;flex-direction:column;min-width:0;}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:15px;padding:0 24px;min-height:74px;background:var(--ground);background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
.crumb h1{font-size:20px;font-weight:800;line-height:1.15;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.icon-btn{flex:none;width:35px;height:35px;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--r-md);color:var(--ink-mid);background:var(--panel);transition:color .18s,border-color .18s;}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.icon-btn:hover{color:var(--arc);border-color:var(--arc);}
.views{flex:1;padding:24px;max-width:1240px;width:100%;}
.view{display:none;}
.view.is-on{display:block;animation:rise .45s cubic-bezier(.22,.9,.3,1);}
/* ── ouverture d une affaire : la carte s etend en panneau ── */
.carte-fantome{position:fixed;z-index:70;pointer-events:none;overflow:hidden;background:var(--panel);border:1.5px solid var(--arc);border-radius:var(--r-lg);box-shadow:0 22px 60px -18px rgba(0,0,0,.55),0 0 0 5px var(--arc-soft);transition:left .3s cubic-bezier(.3,.85,.25,1),top .3s cubic-bezier(.3,.85,.25,1),width .3s cubic-bezier(.3,.85,.25,1),height .3s cubic-bezier(.3,.85,.25,1),opacity .22s ease .27s;}
.carte-fantome .fantome-client{position:absolute;left:18px;top:13px;font-family:var(--f-data);font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--arc);}
.carte-fantome .fantome-nom{position:absolute;left:18px;top:29px;font-family:var(--f-display);font-size:20px;font-weight:800;letter-spacing:-.03em;color:var(--ink);white-space:nowrap;}
.carte.part{transform:scale(.96);opacity:.35;transition:transform .2s,opacity .2s;}
#ficheContenu.entree > *{animation:rise .42s cubic-bezier(.22,.9,.3,1) backwards;}
#ficheContenu.entree > *:nth-child(2){animation-delay:.06s;}
#ficheContenu.entree > *:nth-child(3){animation-delay:.11s;}
#ficheContenu.entree > *:nth-child(4){animation-delay:.16s;}
#ficheContenu.entree > *:nth-child(5){animation-delay:.21s;}
#ficheContenu.entree > *:nth-child(6){animation-delay:.26s;}
#ficheContenu.entree > *:nth-child(n+7){animation-delay:.3s;}
@media (prefers-reduced-motion: reduce){.carte-fantome{display:none;}#ficheContenu.entree > *{animation:none;}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;border-radius:var(--r-md);font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);white-space:nowrap;transition:transform .15s,border-color .18s,color .18s,background .18s;}
.btn:hover{border-color:var(--arc);color:var(--arc);}
.btn:active{transform:translateY(1px);}
.btn-arc{background:var(--arc);border-color:var(--arc);color:var(--on-arc);}
.btn-arc:hover{filter:brightness(1.12);color:var(--on-arc);}
.btn-ok{background:var(--ok);border-color:var(--ok);color:var(--on-arc);}
.btn-ok:hover{filter:brightness(1.1);color:var(--on-arc);}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn-danger:hover{border-color:var(--stop);color:var(--stop);}
.bloc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:19px 21px;margin-bottom:16px;}
.titre{display:flex;align-items:center;gap:11px;margin-bottom:14px;flex-wrap:wrap;}
.titre h2{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;}
.titre h2::before{content:'';flex:none;width:5px;height:19px;background:var(--arc);border-radius:3px;}
.titre .tot{margin-left:auto;font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;color:var(--ink);}

/* ============================================================ stades */
.stade{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-data);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 11px;border-radius:20px;white-space:nowrap;}
.stade::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.stade.brouillon{background:var(--m-bud-soft);color:var(--m-bud-ink);border:1px solid var(--m-bud);}
.stade.envoye{background:var(--wait-soft);color:var(--wait);border:1px solid var(--wait);}
.stade.en_cours{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);}
.stade.terminee,.stade.archivee{background:var(--idle-soft);color:var(--ink-mid);border:1px solid var(--line);}

/* ============================================================ couloir + cartes */
.couloir{display:flex;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:20px;background:var(--panel);}
.couloir-etape{flex:1;position:relative;padding:14px 18px;border-right:1px solid var(--line);text-align:left;transition:background .18s;--c:var(--idle);}
.couloir-etape:last-child{border-right:none;}
.couloir-etape::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--c);opacity:.35;transition:opacity .2s;}
.couloir-etape:hover{background:var(--panel-2);}
.couloir-etape.is-on{background:var(--panel-2);}
.couloir-etape.is-on::before{opacity:1;}
.couloir-etape.c-brouillon{--c:var(--m-bud);}
.couloir-etape.c-envoye{--c:var(--wait);}
.couloir-etape.c-en_cours{--c:var(--ok);}
.couloir-etape.c-terminee{--c:var(--idle);}
.couloir-n{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:27px;font-weight:800;line-height:1;}
.couloir-lab{font-family:var(--f-data);font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-mid);margin-top:5px;}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:14px;}
.carte{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;text-align:left;display:flex;flex-direction:column;gap:11px;transition:border-color .2s,transform .2s;cursor:pointer;}
.carte:hover{border-color:var(--arc);transform:translateY(-2px);}
.carte-haut{display:flex;align-items:flex-start;gap:10px;}
.carte-client{font-family:var(--f-data);font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim);}
.carte-nom{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.15;}
.carte-desc{font-size:12.5px;color:var(--ink-mid);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.carte .stade{margin-left:auto;flex:none;}
.carte-bas{display:flex;flex-direction:column;gap:7px;padding-top:10px;border-top:1px solid var(--line-soft);}
.carte-chiffres{display:flex;align-items:baseline;gap:12px;font-family:var(--f-data);font-size:11.5px;color:var(--ink-dim);flex-wrap:wrap;}
.carte-chiffres b{font-size:13px;font-weight:700;color:var(--ink);}
.carte-chiffres .e{margin-left:auto;font-weight:700;font-size:13px;}
.e.depasse{color:var(--stop);}
.e.sous{color:var(--ok);}
.e.neutre{color:var(--ink-dim);}
.mini{position:relative;height:8px;background:var(--panel-3);border-radius:5px;}
.mini .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ok);}
.mini .fill.depasse{background:var(--stop);}
.mini .fill.neutre{background:var(--idle);}
.mini .cible{position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:2px;background:var(--m-bud);box-shadow:0 0 0 2px var(--panel);}
.carte-note{font-family:var(--f-data);font-size:10.5px;letter-spacing:.06em;color:var(--ink-dim);}
.section-lab{font-size:11px;}
.section-lab-ligne{display:flex;align-items:center;gap:14px;margin:0 0 10px;}
.groupe-stade{margin-bottom:22px;}
.repli-archivees{margin-top:6px;}

/* ============================================================ fiche */
.retour{display:inline-flex;align-items:center;gap:9px;margin-bottom:16px;font-size:13.5px;font-weight:600;color:var(--ink-mid);transition:color .16s;}
.retour svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.retour:hover{color:var(--arc);}
.fiche-tete{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap;margin-bottom:16px;}
.fiche-client{font-family:var(--f-data);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--arc);}
.fiche-nom{font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1;}
.fiche-desc{font-size:13.5px;color:var(--ink-mid);font-style:italic;}
.etat-sauve{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-family:var(--f-data);font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ok);}
.etat-sauve::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;}
.etat-sauve.encours{color:var(--arc);}
.etat-sauve.erreur{color:var(--stop);}

.cycle{display:flex;align-items:center;flex-wrap:wrap;gap:2px;padding:13px 16px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:16px;}
.pas{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:20px;font-family:var(--f-data);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);white-space:nowrap;}
.pas i{width:9px;height:9px;border-radius:50%;border:2px solid currentColor;flex:none;}
.pas.fait{color:var(--ok);}
.pas.fait i{background:currentColor;}
.pas.actif{color:var(--arc);background:var(--arc-soft);}
.pas.actif i{background:currentColor;box-shadow:0 0 0 4px var(--arc-soft);}
.pas-lien{flex:none;width:22px;height:2px;background:var(--line);margin:0 2px;}
.pas-lien.fait{background:var(--ok);}
.cycle-act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}

.reponse-client{display:flex;align-items:flex-start;gap:11px;padding:12px 15px;border-radius:var(--r-md);margin-bottom:16px;font-size:13.5px;}
.reponse-client.acceptee{background:var(--ok-soft);border:1px solid var(--ok);color:var(--ok);}
.reponse-client.refusee{background:var(--stop-soft);border:1px solid var(--stop);color:var(--stop);}
.reponse-client b{color:var(--ink);}

.bilan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:16px;}
.case{padding:15px 18px;border-right:1px solid var(--line);position:relative;--c:var(--idle);}
.case:last-child{border-right:none;}
.case::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--c);}
.case.budget{--c:var(--m-bud);background:var(--m-bud-soft);}
.case.reel{--c:var(--m-reel);background:var(--m-reel-soft);}
.case.depasse{--c:var(--stop);background:var(--stop-soft);}
.case.sous{--c:var(--ok);background:var(--ok-soft);}
.case.neutre{--c:var(--idle);background:var(--idle-soft);}
.case-lab{display:flex;align-items:center;gap:8px;font-family:var(--f-data);font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mid);margin-bottom:8px;}
.case-lab .sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none;}
.case-val{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:32px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--ink);}
.case-val small{font-size:16px;margin-left:3px;color:var(--ink-dim);}
.case.depasse .case-val,.case.sous .case-val{color:var(--c);}
.case-sous{font-size:12px;color:var(--ink-mid);margin-top:7px;}

.tbl{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{font-family:var(--f-data);font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim);text-align:left;padding:0 10px 10px;white-space:nowrap;border-bottom:1px solid var(--line);}
th.c{text-align:right;}
th .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:-1px;}
td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
tbody tr:hover td{background:var(--panel-2);}
td.nom{font-family:var(--f-display);font-size:15.5px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;}
td.nom .mach{font-family:var(--f-data);font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 6px;border-radius:3px;margin-left:8px;background:var(--panel-3);color:var(--ink-mid);border:1px solid var(--line);}
.hors{font-family:var(--f-data);font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:3px;margin-left:8px;background:var(--stop);color:#fff;}
td.bud{background:var(--m-bud-soft);text-align:right;}
td.bud input{width:88px;padding:8px 10px;border-radius:var(--r-sm);border:1.5px solid var(--m-bud);background:var(--panel);color:var(--m-bud-ink);font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;text-align:right;-moz-appearance:textfield;}
td.bud input::-webkit-outer-spin-button,td.bud input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
td.bud input:focus{outline:none;box-shadow:0 0 0 3px var(--m-bud-soft);}
td.bud input::placeholder,td.qte input::placeholder{color:var(--ink-dim);opacity:.55;font-weight:400;}
td.bud .fixe{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;color:var(--m-bud-ink);}
td.bud .vide{font-family:var(--f-data);color:var(--ink-dim);}
td.reel{background:var(--m-reel-soft);text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;white-space:nowrap;}
td.ec{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;white-space:nowrap;}
td.ec.depasse{color:var(--stop);}
td.ec.sous{color:var(--ok);}
td.ec.neutre{color:var(--ink-dim);}
td.conso{min-width:150px;}
td.conso .mini{height:10px;}
td.conso .mini .cible{top:-4px;bottom:-4px;}
td.eur{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:600;color:var(--ink-mid);white-space:nowrap;}
tr.total td{border-bottom:none;border-top:2.5px solid var(--arc);padding-top:14px;font-family:var(--f-display);font-size:14px;font-weight:800;}
tr.total td.bud,tr.total td.reel,tr.total td.ec{font-family:var(--f-data);font-size:19px;font-weight:800;}
tr.total td.eur{font-family:var(--f-data);font-size:15px;font-weight:700;color:var(--ink);}
tr.total:hover td{background:none;}
.verrou{display:flex;align-items:center;gap:9px;margin-top:13px;font-size:12.5px;color:var(--ink-dim);flex-wrap:wrap;}
.verrou svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none;}
.verrou-conds{margin-left:auto;font-family:var(--f-data);font-size:11.5px;color:var(--ink-mid);}

td.txt input{width:100%;min-width:130px;padding:8px 10px;border-radius:var(--r-sm);border:1px solid transparent;background:var(--panel-2);color:var(--ink);font-size:13.5px;}
td.txt input:hover{background:var(--panel-3);}
td.txt input:focus{border-color:var(--arc);background:var(--panel);outline:none;}
td.qte input{width:78px;padding:8px 10px;border-radius:var(--r-sm);border:1px solid transparent;background:var(--panel-2);color:var(--ink);font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:13.5px;text-align:right;-moz-appearance:textfield;}
td.qte input::-webkit-outer-spin-button,td.qte input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
td.qte input:hover{background:var(--panel-3);}
td.qte input:focus{border-color:var(--arc);background:var(--panel);outline:none;}

.note-client{margin-top:13px;padding-top:13px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px;}
.note-client label{font-size:13px;font-weight:600;}
.note-client label small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-dim);}
.note-client input{padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:13.5px;}
.note-client input:focus{border-color:var(--arc);outline:none;}
.conds-devis{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:11px;}
.cd{display:flex;flex-direction:column;gap:5px;min-width:0;}
.cd label{font-family:var(--f-data);font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim);}
.cd input,.cd select{padding:9px 11px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:13.5px;}
.cd input:focus,.cd select:focus{border-color:var(--arc);outline:none;}
.echeancier{margin-top:10px;padding:11px 13px;border:1px dashed var(--m-bud);border-radius:var(--r-sm);background:var(--m-bud-soft);}
.ech-ligne{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px;flex-wrap:wrap;}
.ech-ligne input{padding:7px 9px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:12.5px;}
.ech-ligne input[data-e="label"]{flex:2;min-width:130px;}
.ech-ligne input[data-e="pct"]{flex:none;width:64px;font-family:var(--f-data);text-align:right;}
.ech-ligne input[data-e="date"]{flex:none;width:140px;font-family:var(--f-data);}
.ech-ligne .lecture{flex:2;}
.ech-ligne b{margin-left:auto;font-family:var(--f-data);color:var(--m-bud-ink);}
.ech-total{font-family:var(--f-data);font-size:11px;margin-top:6px;color:var(--ink-dim);}
.ech-total.mauvais{color:var(--stop);}

.syn{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
.si{position:relative;overflow:hidden;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 15px 14px 19px;--c:var(--idle);}
.si::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);}
.si-lab{font-family:var(--f-data);font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-mid);margin-bottom:7px;}
.si-val{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1;}
.si.prix{--c:var(--arc);background:var(--arc-soft);border-color:var(--arc);}
.si.prix .si-val{font-size:26px;color:var(--arc);}
.si.marge .si-val{color:var(--ok);}
.si.pointe{--c:var(--m-reel);}
.si.pointe .si-val{color:var(--m-reel);}
.si.negatif{--c:var(--stop);background:var(--stop-soft);}
.si.negatif .si-val{color:var(--stop);}
.si-sous{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:10.5px;color:var(--ink-mid);margin-top:5px;}
.syn-coeff{display:flex;align-items:center;gap:10px;margin-top:13px;font-size:12.5px;color:var(--ink-dim);flex-wrap:wrap;}
.syn-vente{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px;font-weight:600;color:var(--ink-mid);cursor:pointer;width:fit-content;}
.syn-vente input{width:16px;height:16px;accent-color:var(--arc);cursor:pointer;}
.syn-vente:hover{color:var(--ink);}
.syn-coeff input{width:76px;padding:6px 9px;border-radius:var(--r-sm);border:1px solid var(--arc);background:var(--panel);color:var(--arc);font-family:var(--f-data);font-size:14px;font-weight:700;text-align:center;}
.syn-coeff input:focus{outline:none;box-shadow:0 0 0 3px var(--arc-soft);}
.syn-coeff input:disabled{opacity:.7;border-style:dashed;}
.syn-note{margin:8px 0 0;font-size:12px;color:var(--ink-dim);}

/* ============================================================ pointage */
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px;}
.qa-btn{text-align:left;padding:13px 14px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md);display:flex;flex-direction:column;gap:5px;transition:transform .18s,border-color .18s;}
.qa-btn:hover{transform:translateY(-2px);border-color:var(--arc);}
.qa-client{font-family:var(--f-data);font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim);}
.qa-nom{font-family:var(--f-display);font-size:16.5px;font-weight:800;letter-spacing:-.025em;}
.qa-h{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;color:var(--arc);}
.saisie{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:7px;background:var(--panel-2);border-radius:var(--r-md);}
.saisie:last-child{margin-bottom:0;}
.saisie-info{flex:1;min-width:0;}
.saisie-l1{font-family:var(--f-display);font-size:15px;font-weight:700;}
.saisie-l2{font-family:var(--f-data);font-size:11px;color:var(--ink-dim);}
.saisie-h{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;color:var(--arc);}
.saisie-acts{display:flex;gap:6px;flex:none;}
.fab{position:fixed;right:24px;bottom:24px;z-index:40;width:56px;height:56px;border-radius:50%;background:var(--arc);color:var(--on-arc);display:grid;place-items:center;box-shadow:0 8px 22px -6px var(--arc-line);transition:transform .2s;}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;}
.fab:hover{transform:scale(1.07) rotate(90deg);}
.fab:active{transform:scale(.95);}

/* ============================================================ gestion */
.gest{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;}
.gest .bloc{margin-bottom:0;}
.gest-large{grid-column:1 / -1;}
.ligne-g{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;}
.ligne-g:last-child{border-bottom:none;}
.ligne-g .n{flex:1;min-width:0;font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ligne-g .n .mach{font-family:var(--f-data);font-size:9px;font-weight:700;letter-spacing:.06em;padding:1px 5px;border-radius:3px;margin-left:7px;background:var(--panel-3);color:var(--ink-mid);border:1px solid var(--line);}
.ligne-g .m{font-family:var(--f-data);font-size:11px;color:var(--ink-dim);white-space:nowrap;}
.ligne-g input.taux-inline{width:66px;padding:5px 8px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);color:var(--arc);font-family:var(--f-data);font-size:12.5px;font-weight:700;text-align:right;-moz-appearance:textfield;}
.ligne-g input.taux-inline::-webkit-outer-spin-button,.ligne-g input.taux-inline::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.ligne-g input.taux-inline:focus{border-color:var(--arc);outline:none;}
.ligne-g .acts{display:flex;gap:5px;}
.ajout{display:flex;gap:8px;margin-top:13px;padding-top:13px;border-top:1px solid var(--line-soft);flex-wrap:wrap;}
.ajout input{flex:1;min-width:110px;padding:8px 11px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:13px;}
.ajout input:focus{border-color:var(--arc);outline:none;}
.check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-mid);white-space:nowrap;cursor:pointer;}
.check input{width:16px;height:16px;accent-color:var(--arc);cursor:pointer;}
.ent{display:flex;gap:22px;flex-wrap:wrap;}
.ent-logo{flex:none;display:flex;flex-direction:column;align-items:center;gap:9px;width:150px;}
.ent-logo-apercu{width:110px;height:110px;display:grid;place-items:center;background:var(--panel-2);border:1px dashed var(--line);border-radius:var(--r-md);overflow:hidden;}
.ent-logo-apercu img{max-width:100%;max-height:100%;object-fit:contain;}
.ent-logo-note{font-family:var(--f-data);font-size:10px;color:var(--ink-dim);text-align:center;}
.ent-champs{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;}
.ch{display:flex;flex-direction:column;gap:5px;min-width:0;}
.ch.ch-l{grid-column:1 / -1;}
.ch label{font-family:var(--f-data);font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim);}
.ch input{padding:9px 11px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:13.5px;}
.ch input:focus{border-color:var(--arc);outline:none;}

/* ============================================================ modales */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .26s;overflow-y:auto;}
.scrim.is-on{opacity:1;pointer-events:auto;}
.sheet{width:min(440px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;transform:translateY(16px) scale(.97);opacity:0;transition:transform .3s cubic-bezier(.24,1.1,.4,1),opacity .26s;}
.scrim.is-on .sheet{transform:none;opacity:1;}
/* ── saisie d heures : la croix tourne, la fenetre jaillit du bouton ── */
.fab.appuye svg{animation:vrille .5s cubic-bezier(.3,1.25,.4,1);}
@keyframes vrille{from{transform:rotate(0deg);}to{transform:rotate(180deg);}}
.fab.appuye::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:2.5px solid var(--arc);animation:onde .55s ease-out forwards;pointer-events:none;}
@keyframes onde{from{transform:scale(1);opacity:.85;}to{transform:scale(2.2);opacity:0;}}
.scrim.depuis-fab .sheet{transform:translate(min(30vw,260px),min(36vh,300px)) scale(.2);transform-origin:100% 100%;}
.scrim.depuis-fab.is-on .sheet{transform:none;}
#scrimSaisie.is-on .champ{animation:rise .38s cubic-bezier(.22,.9,.3,1) backwards;}
#scrimSaisie.is-on .champ:nth-child(1){animation-delay:.08s;}
#scrimSaisie.is-on .champ:nth-child(2){animation-delay:.14s;}
#scrimSaisie.is-on .champ:nth-child(3){animation-delay:.2s;}
#scrimSaisie.is-on .champ:nth-child(n+4){animation-delay:.25s;}
/* ── vie de l atelier ── */
@keyframes bondit{0%{transform:scale(1);}40%{transform:scale(1.32);}100%{transform:scale(1);}}
@keyframes basculePas{from{transform:rotateX(90deg);opacity:0;}to{transform:none;opacity:1;}}
@keyframes clignoteJauge{0%,100%{box-shadow:0 0 0 0 rgba(255,94,82,0);}50%{box-shadow:0 0 0 5px var(--stop-soft);}}
@keyframes arriveLigne{from{opacity:0;transform:translateY(-10px);background:var(--arc-soft);}45%{opacity:1;transform:none;background:var(--arc-soft);}to{background:transparent;}}
@keyframes traceCoche{to{stroke-dashoffset:0;}}
@keyframes replieCarte{to{opacity:0;transform:scale(.85) translateY(12px);}}
@keyframes deplieBandeau{from{opacity:0;transform:scaleY(.55);transform-origin:top center;}to{opacity:1;transform:none;}}
@keyframes pulseVert{0%{text-shadow:0 0 0 rgba(0,0,0,0);}35%{text-shadow:0 0 13px var(--ok);}100%{text-shadow:0 0 0 rgba(0,0,0,0);}}
.couloir-n.bondit{animation:bondit .45s cubic-bezier(.3,1.3,.4,1);}
.pas.bascule{animation:basculePas .45s cubic-bezier(.24,1.1,.4,1);}
.mini .fill.clignote{animation:clignoteJauge .7s ease-out 1;}
.saisie.neuve{animation:arriveLigne 1.2s cubic-bezier(.22,.9,.3,1);border-radius:var(--r-sm);}
.toast.is-on svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:traceCoche .4s ease-out .12s forwards;}
.carte.sen-va{animation:replieCarte .38s ease-in forwards;pointer-events:none;}
#ficheContenu.entree .reponse-client{animation:deplieBandeau .5s cubic-bezier(.24,1.1,.4,1);}
.etat-sauve.pulse{animation:pulseVert .9s ease-out 1;}
#listeAffaires.entree .carte{animation:rise .4s cubic-bezier(.22,.9,.3,1) backwards;}
#listeAffaires.entree .grille .carte:nth-child(2){animation-delay:.05s;}
#listeAffaires.entree .grille .carte:nth-child(3){animation-delay:.1s;}
#listeAffaires.entree .grille .carte:nth-child(4){animation-delay:.15s;}
#listeAffaires.entree .grille .carte:nth-child(n+5){animation-delay:.2s;}
html.theme-fondu,html.theme-fondu *,html.theme-fondu *::before,html.theme-fondu *::after{transition:background-color .35s ease,color .35s ease,border-color .35s ease,fill .35s ease,stroke .35s ease !important;}
@media (prefers-reduced-motion: reduce){
  .fab.appuye svg,.fab.appuye::after,#scrimSaisie.is-on .champ{animation:none;}
  .scrim.depuis-fab .sheet{transform:translateY(16px) scale(.97);}
  .couloir-n.bondit,.pas.bascule,.mini .fill.clignote,.saisie.neuve,.toast.is-on svg path,
  #ficheContenu.entree .reponse-client,.etat-sauve.pulse,#listeAffaires.entree .carte{animation:none;}
  .toast.is-on svg path{stroke-dashoffset:0;}
  .carte.sen-va{animation:none;opacity:0;}
  html.theme-fondu,html.theme-fondu *{transition:none !important;}
}
.sheet-head{flex:none;display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);}
.sheet-head h2{font-size:16px;font-weight:700;}
.sheet-head .icon-btn{margin-left:auto;}
.sheet-body{padding:18px;overflow-y:auto;}
.sheet-foot{flex:none;display:flex;gap:10px;padding:15px 18px;border-top:1px solid var(--line);background:var(--panel-2);}
.sheet-foot .btn{flex:1;}
.sheet-foot .btn-arc,.sheet-foot .btn-ok{flex:2;}
.lien-client{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--arc-soft);border:1px solid var(--arc);font-family:var(--f-data);font-size:12.5px;color:var(--arc);word-break:break-all;}

/* recherche */
.recherche{position:relative;margin-bottom:14px;max-width:420px;}
.recherche svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-dim);fill:none;stroke-width:1.8;}
.recherche input{width:100%;padding:11px 13px 11px 37px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:14px;transition:border-color .18s;}
.recherche input:focus{border-color:var(--arc);outline:none;}
.recherche input::placeholder{color:var(--ink-dim);}

/* fiche client */
.identite{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;}
.sceau{flex:none;width:62px;height:62px;border-radius:var(--r-md);background:var(--arc-soft);border:1.5px solid var(--arc);display:grid;place-items:center;font-family:var(--f-display);font-size:23px;font-weight:800;color:var(--arc);}
.identite-corps{flex:1;min-width:220px;}
.identite-nom{font-family:var(--f-display);font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1.1;}
.identite-lignes{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:8px;font-size:13.5px;color:var(--ink-mid);}
.identite-lignes span{display:inline-flex;align-items:center;gap:7px;}
.identite-lignes svg{width:14px;height:14px;stroke:var(--ink-dim);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.identite-actions{display:flex;gap:9px;flex-wrap:wrap;}
.compteurs{display:flex;margin-top:18px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;}
.compteur{flex:1;padding:13px 18px;border-right:1px solid var(--line);background:var(--panel-2);}
.compteur:last-child{border-right:none;}
.compteur b{display:block;font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1;}
.compteur span{font-family:var(--f-data);font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim);}
.gens{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:13px;}
.personne{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px;display:flex;flex-direction:column;gap:11px;transition:border-color .2s,transform .2s;}
.personne:hover{border-color:var(--arc);transform:translateY(-2px);}
.personne-tete{display:flex;align-items:center;gap:12px;}
.pastille{flex:none;width:42px;height:42px;border-radius:50%;background:var(--panel-3);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-data);font-size:14px;font-weight:700;color:var(--arc);}
.personne-nom{font-family:var(--f-display);font-size:16.5px;font-weight:800;letter-spacing:-.02em;line-height:1.15;}
.personne-fonction{font-family:var(--f-data);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin-top:2px;}
.personne-coord{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line-soft);}
.coord{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-mid);min-width:0;}
.coord svg{flex:none;width:14px;height:14px;stroke:var(--arc);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.coord span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.coord.absente{color:var(--ink-dim);font-style:italic;}
.coord.absente svg{stroke:var(--ink-dim);}
.personne-actions{display:flex;gap:7px;margin-top:auto;}
.personne-actions .btn{flex:1;}
.personne-ajout{border-style:dashed;background:none;cursor:pointer;align-items:center;justify-content:center;min-height:150px;display:flex;flex-direction:column;gap:9px;color:var(--ink-dim);transition:border-color .2s,color .2s,transform .2s;}
.personne-ajout:hover{border-color:var(--arc);color:var(--arc);transform:translateY(-2px);}
.personne-ajout svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;}
.personne-ajout b{font-size:14px;font-weight:600;}
.mini-affaires{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px;}
.mini-affaire{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:border-color .2s,transform .2s;text-align:left;}
.mini-affaire:hover{border-color:var(--arc);transform:translateY(-2px);}
.mini-affaire-tete{display:flex;align-items:center;gap:9px;}
.mini-affaire-nom{font-family:var(--f-display);font-size:16px;font-weight:800;letter-spacing:-.025em;}
.mini-affaire-tete .stade{margin-left:auto;}
.mini-affaire-h{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;color:var(--arc);}
@media (max-width:640px){
  .identite-nom{font-size:23px;}
  .compteurs{flex-wrap:wrap;}
  .compteur{flex:1 1 50%;border-bottom:1px solid var(--line);}
  .identite-actions{width:100%;}
  .identite-actions .btn{flex:1;}
}

/* onglets de la gestion */
.gonglets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.gonglet{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:22px;border:1px solid var(--line);background:var(--panel);color:var(--ink-mid);font-size:14px;font-weight:600;transition:border-color .18s,color .18s,background .18s,transform .15s;}
.gonglet:hover{border-color:var(--arc);color:var(--arc);}
.gonglet:active{transform:translateY(1px);}
.gonglet.is-on{background:var(--arc);border-color:var(--arc);color:var(--on-arc);}
.gonglet-n{font-family:var(--f-data);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--panel-3);color:var(--ink-mid);border:1px solid var(--line);}
.gonglet.is-on .gonglet-n{background:rgba(0,0,0,.22);color:var(--on-arc);border-color:transparent;}
.gest-panneau{animation:rise .35s cubic-bezier(.22,.9,.3,1);}

/* bandes client (affaires et accès rapide) */
.bande-client{display:flex;align-items:baseline;gap:10px;margin:16px 0 10px;}
.bande-client:first-child{margin-top:0;}
.bande-client h3{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-size:17px;font-weight:800;letter-spacing:-.03em;}
.bande-client h3::before{content:'';flex:none;width:4px;height:16px;background:var(--arc);border-radius:2px;}
.bande-client .rule{flex:1;height:1px;background:var(--line);}
.bande-client .tot-client{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;background:var(--arc-soft);color:var(--arc);border:1px solid var(--arc);border-radius:20px;padding:1px 10px;white-space:nowrap;}
.bande-client .compte{font-family:var(--f-data);font-size:11px;font-weight:700;color:var(--ink-mid);background:var(--panel-3);border:1px solid var(--line);border-radius:20px;padding:1px 9px;}
.qa{margin-bottom:6px;}
.qa-desc{font-size:11.5px;color:var(--ink-dim);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.hist-outils{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;}
.hist-periodes{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;flex:none;}
.hist-periodes button{border:none;background:none;color:var(--ink-mid);font-family:var(--f-ui);font-size:12.5px;font-weight:600;padding:7px 12px;cursor:pointer;}
.hist-periodes button + button{border-left:1px solid var(--line);}
.hist-periodes button[aria-pressed="true"]{background:var(--arc);color:var(--on-arc);}
#histRecherche{flex:1 1 180px;min-width:0;padding:8px 11px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-family:var(--f-ui);font-size:13.5px;}
#histRecherche:focus{outline:none;border-color:var(--arc);box-shadow:0 0 0 3px var(--arc-soft);}
.hist-liste{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--panel-2);}
.hist{border-top:1px solid var(--line-soft);}
.hist:first-child{border-top:none;}
.hist-ligne{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:none;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;}
.hist-ligne:hover{background:var(--panel-3);}
.hist-ligne:focus-visible{outline:2px solid var(--arc);outline-offset:-2px;}
.hist-id{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.hist-nom{font-family:var(--f-display);font-size:15.5px;font-weight:800;letter-spacing:-.02em;}
.hist-client{font-family:var(--f-data);font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim);}
.hist-quand{font-family:var(--f-data);font-size:11px;color:var(--ink-dim);white-space:nowrap;}
.hist-total{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;background:var(--arc);color:var(--on-arc);border-radius:20px;padding:2px 10px;white-space:nowrap;}
.hist-chevron{flex:none;width:18px;height:18px;fill:none;stroke:var(--ink-mid);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease;}
.hist.ouvert{background:var(--panel);}
.hist.ouvert .hist-chevron{transform:rotate(180deg);}
.hist-saisies{padding:0 14px 14px;animation:rise .25s ease;}
.hist-desc{font-size:12px;color:var(--ink-dim);font-style:italic;margin-bottom:8px;}
.hist-plus{display:block;width:100%;margin-top:2px;padding:9px;border:1px dashed var(--line);border-radius:var(--r-md);background:none;color:var(--arc);font-family:var(--f-ui);font-size:13px;font-weight:600;cursor:pointer;}
.hist-plus:hover{border-color:var(--arc);background:var(--arc-soft);}
.hist-resume{margin-top:9px;font-family:var(--f-data);font-size:11px;color:var(--ink-dim);text-align:right;}
.hist-vide{padding:16px;border:1px dashed var(--line);border-radius:var(--r-lg);color:var(--ink-dim);font-size:13px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.chip{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--arc-soft);color:var(--arc);border:1px solid var(--arc);}
.lien-btn{border:none;background:none;padding:0;color:var(--arc);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;}
.hist .saisie{background:var(--panel);}

/* actions de la fiche */
.fiche-actions{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 14px;}

/* réordonnancement des postes */
.ord{display:flex;flex-direction:column;gap:3px;flex:none;}
.ord button{width:24px;height:17px;display:grid;place-items:center;border:1px solid var(--line);border-radius:3px;color:var(--ink-dim);background:var(--panel);transition:color .16s,border-color .16s;}
.ord button svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.ord button:hover:not(:disabled){color:var(--arc);border-color:var(--arc);}
.ord button:disabled{opacity:.3;cursor:not-allowed;}

/* toast */
.toast{position:fixed;right:22px;bottom:22px;z-index:80;display:flex;align-items:center;gap:10px;padding:13px 17px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--ok);color:var(--ink);font-size:13.5px;font-weight:500;box-shadow:var(--shadow);transform:translateY(90px);opacity:0;transition:transform .34s cubic-bezier(.24,1.2,.4,1),opacity .28s;}
.toast.is-on{transform:none;opacity:1;}
.toast.erreur{border-color:var(--stop);}
.toast svg{width:16px;height:16px;stroke:var(--ok);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.toast.erreur svg{stroke:var(--stop);}

/* ============================================================ adaptatif */
@media (max-width:980px){
  .syn{grid-template-columns:repeat(2,minmax(0,1fr));}
  .gest{grid-template-columns:minmax(0,1fr);}
  .bilan{grid-template-columns:minmax(0,1fr);}
  .case{border-right:none;border-bottom:1px solid var(--line);}
  .case:last-child{border-bottom:none;}
  .couloir{flex-wrap:wrap;}
  .couloir-etape{flex:1 1 50%;border-bottom:1px solid var(--line);}
  .ent-champs{grid-template-columns:repeat(2,minmax(0,1fr));}
  .cycle-act{margin-left:0;width:100%;padding-top:9px;}
}
@media (max-width:720px){
  #ecranApp{grid-template-columns:minmax(0,1fr);}
  .rail{position:fixed;left:0;top:auto;bottom:0;height:auto;width:100%;z-index:50;flex-direction:row;border-right:none;border-top:1px solid var(--line);}
  .brand,.rail-foot{display:none;}
  .nav{display:flex;padding:0;}
  .nav-item{flex:1;flex-direction:column;gap:4px;padding:10px 6px;border-left:none;border-top:3px solid transparent;justify-content:center;align-items:center;}
  .nav-item.is-on{border-left:none;border-top-color:var(--arc);}
  .nav-item span{font-size:11px;}
  .topbar-logo{display:block;}
  .nav-item{position:relative;}
  .nav-badge{position:absolute;top:5px;left:calc(50% + 7px);margin:0;font-size:9.5px;padding:0 5px;}
  .views{padding:16px 13px 92px;}
  .topbar{padding:0 14px;min-height:62px;}
  .fiche-nom{font-size:24px;}
  .case-val{font-size:27px;}
  th:first-child,td.nom{position:sticky;left:0;z-index:2;background:var(--panel);box-shadow:1px 0 0 var(--line);max-width:120px;overflow:hidden;text-overflow:ellipsis;}
  tbody tr:hover td.nom{background:var(--panel-2);}
  .fab{bottom:calc(76px + env(safe-area-inset-bottom));}
  .scrim.depuis-fab .sheet{transform:translateY(70vh) scale(.7);}
  .champ input,.champ select,.champ textarea{font-size:16px;}
  .conds-devis{grid-template-columns:minmax(0,1fr);}
  .scrim{place-items:end center;padding:0;}
  .sheet{width:100%;border-radius:16px 16px 0 0;max-height:92vh;}
  .sheet-foot{padding-bottom:calc(15px + env(safe-area-inset-bottom));}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}

/* ══════════════ GESTION : sous-navigation groupée + panneau de travail ══════════════ */
.gx{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:start;}
.gx-nav{position:sticky;top:90px;display:flex;flex-direction:column;gap:18px;}
.gx-groupe{display:flex;flex-direction:column;gap:3px;}
.gx-groupe .eyebrow{padding:0 10px 4px;}
.gx-lien{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:1px solid transparent;border-radius:var(--r-md);background:none;text-align:left;color:var(--ink-mid);font:inherit;cursor:pointer;}
.gx-lien:hover{background:var(--panel-2);color:var(--ink);}
.gx-lien[aria-current="page"]{background:var(--panel);border-color:var(--line);color:var(--ink);}
.gx-lien svg{flex:none;width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.gx-lien-t{display:flex;flex-direction:column;min-width:0;flex:1;}
.gx-lien-t b{font-weight:600;font-size:13.5px;}
.gx-lien-t small{font-size:11.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gx-alerte{width:7px;height:7px;border-radius:50%;background:var(--m-bud-ink);flex:none;}
.gx-lien .gx-chev{display:none;}
.gx-panneau{min-width:0;display:flex;flex-direction:column;gap:16px;}
.gx-retour{display:none;align-self:flex-start;border:none;background:none;color:var(--arc);font:inherit;font-weight:600;padding:0;cursor:pointer;}
.gx-tete{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;}
.gx-tete h2{font-size:22px;font-weight:800;}
.gx-tete p{margin:3px 0 0;color:var(--ink-dim);font-size:13px;max-width:62ch;}
.gx-tete .btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;}
.gx-carte{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);}
.gx-champ{display:flex;flex-direction:column;gap:5px;min-width:0;}
.gx-champ label{font-family:var(--f-data);font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim);}
.gx-champ input,.gx-outils input,.gx-ajout-ligne input,.gx-ajout-poste input[type="text"],.gx-user-ajout input{width:100%;padding:9px 11px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-family:var(--f-ui);font-size:14px;}
.gx-champ input:focus,.gx-outils input:focus,.gx-ajout-ligne input:focus,.gx-ajout-poste input:focus,.gx-user-ajout input:focus{outline:none;border-color:var(--arc);box-shadow:0 0 0 3px var(--arc-soft);}
.gx-pastille{display:inline-flex;align-items:center;font-family:var(--f-data);font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;}
.gx-pastille.ok{background:var(--ok-soft);color:var(--ok);}
.gx-pastille.warn{background:var(--m-bud-soft);color:var(--m-bud-ink);}
.gx-pastille.neutre{background:var(--panel-3);color:var(--ink-dim);}
.gx-pastille.arc{background:var(--arc-soft);color:var(--arc);}
.gx-vide{color:var(--ink-dim);}
.gx-vide-bloc{padding:14px 16px;color:var(--ink-dim);font-size:13px;}
.gx-menu-zone{position:relative;}
.gx-menu-btn{border:1px solid transparent;background:none;border-radius:var(--r-sm);width:32px;height:32px;display:grid;place-items:center;color:var(--ink-dim);cursor:pointer;}
.gx-menu-btn:hover,.gx-menu-btn[aria-expanded="true"]{border-color:var(--line);color:var(--ink);}
.gx-dots{width:16px;height:16px;fill:currentColor;}
.gx-menu{position:absolute;right:0;top:calc(100% + 4px);z-index:30;min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);padding:5px;display:flex;flex-direction:column;}
.gx-menu[hidden]{display:none;}
.gx-menu button{border:none;background:none;text-align:left;padding:8px 10px;border-radius:var(--r-sm);font:inherit;font-size:13px;color:var(--ink);cursor:pointer;}
.gx-menu button:hover{background:var(--panel-2);}
.gx-menu button.rouge{color:var(--stop);}

/* coordonnées & devis */
.gx-ent{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);gap:18px;align-items:start;}
.gx-ent-form{display:flex;flex-direction:column;gap:14px;}
.gx-fs{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px 16px;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;background:var(--panel);}
.gx-fs legend{font-family:var(--f-display);font-weight:700;font-size:14px;padding:0 6px;}
.gx-champ.large,.gx-depot{grid-column:1 / -1;}
.gx-depot{display:flex;align-items:center;gap:14px;border:1px dashed var(--line);border-radius:var(--r-md);padding:12px;}
.gx-depot img{max-width:120px;max-height:46px;object-fit:contain;background:#fff;border-radius:4px;padding:3px;}
.gx-depot p{margin:0;font-size:12.5px;color:var(--ink-dim);flex:1;min-width:0;}
.gx-enr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r-lg);background:var(--arc-soft);border:1px solid var(--arc-line);position:sticky;bottom:12px;}
.gx-enr[hidden]{display:none;}
.gx-enr span{flex:1;font-weight:600;font-size:13px;}
.gx-apercu{position:sticky;top:90px;display:flex;flex-direction:column;gap:8px;}
.gx-feuille{background:#FFFFFF;color:#1A2129;border-radius:var(--r-md);padding:20px 20px 24px;box-shadow:var(--shadow);border:1px solid var(--line);font-size:11px;line-height:1.45;}
.gx-f-haut{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
.gx-f-haut img{max-width:140px;max-height:56px;object-fit:contain;}
.gx-f-coord{text-align:right;color:#4A5560;}
.gx-f-coord b{color:#1A2129;}
.gx-feuille hr{border:none;border-top:1px solid #D5DCE4;margin:14px 0;}
.gx-f-titre{font-family:var(--f-display);font-weight:800;font-size:15px;color:#0A5FC0;}
.gx-feuille i{display:block;height:7px;border-radius:3px;background:#EEF1F5;margin-top:7px;}
.gx-f-pied{margin-top:14px;color:#6B7680;font-size:9.5px;}

/* clients */
.gx-bandeau{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:var(--r-lg);background:var(--m-bud-soft);color:var(--ink-mid);font-size:13px;}
.gx-bandeau b{color:var(--m-bud-ink);}
.gx-outils{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.gx-outils input{flex:1 1 220px;width:auto;}
.gx-filtres{display:flex;gap:6px;flex-wrap:wrap;}
.gx-filtre{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-mid);cursor:pointer;}
.gx-filtre[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink);}
.gx-clients{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start;}

/* ══════════════ CINÉMATIQUE D'OUVERTURE : la lame Somépré ══════════════
   Le O du logo (lame de scie + engrenage) démarre et projette des
   étincelles, le mot s'ouvre de part et d'autre, la lame s'arrête pile en
   place, puis le logo rejoint sa place dans l'application pendant que
   l'écran se referme dessus. Une fois par lancement ; touche/clic pour passer.
   Géométrie (en % de la toile des calques img/intro-*.png, 933 x 240) :
   centre de la lame 21.5627% 48.5375%, centre de l'engrenage 22.5959% 43.4042%. */
html.intro-active,html.intro-active body{overflow:hidden;}
#intro{position:fixed;inset:0;z-index:9999;background:#04070A;color:#fff;display:grid;place-items:center;overflow:hidden;
  --cx:50%;--cy:50%;--rfin:0px;clip-path:circle(150% at var(--cx) var(--cy));
  transition:clip-path .8s cubic-bezier(.75,0,.2,1),opacity .25s ease;-webkit-tap-highlight-color:transparent;cursor:pointer;}
#intro.sortie{clip-path:circle(var(--rfin) at var(--cx) var(--cy));}
#intro.fondu{opacity:0;}
#intro canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.intro-grille{position:absolute;inset:-2px;opacity:0;pointer-events:none;
  background-image:linear-gradient(rgba(77,166,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(77,166,255,.07) 1px,transparent 1px);
  background-size:44px 44px;background-position:center;
  -webkit-mask-image:radial-gradient(circle at 50% 48%,#000 0,transparent 62%);mask-image:radial-gradient(circle at 50% 48%,#000 0,transparent 62%);
  animation:introApparait 1.4s .1s ease forwards;}
@keyframes introApparait{to{opacity:1;}}
.intro-flash{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(circle at var(--fx,50%) var(--fy,50%),rgba(215,236,255,.8) 0,rgba(77,166,255,.28) 16%,transparent 46%);}
#intro.allume .intro-flash{animation:introFlash .8s ease-out forwards;}
@keyframes introFlash{0%{opacity:0;}12%{opacity:1;}100%{opacity:0;}}
.intro-scene{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(14px,3vh,26px);}
.il-logo{position:relative;width:min(88vw,760px);aspect-ratio:933/240;opacity:0;transform:scale(.55);
  transform-origin:21.5627% 48.5375%;filter:blur(6px);
  transition:opacity .5s ease,transform .7s cubic-bezier(.2,1.25,.35,1),filter .5s ease;}
/* le O d'abord seul, au centre de l'écran ; il glisse à sa place quand le mot s'ouvre */
#intro.apparait .il-logo{opacity:1;transform:translateX(28.44%) scale(1.6);filter:none;}
#intro.texte .il-logo{transform:none;transition:transform 1s cubic-bezier(.16,.9,.2,1);}
#intro.sortie .il-logo{transition:transform .8s cubic-bezier(.75,0,.2,1);}
.il-couche{position:absolute;inset:0;background:#fff;
  -webkit-mask:var(--m) 0 0/100% 100% no-repeat;mask:var(--m) 0 0/100% 100% no-repeat;}
.il-mot{--m:url(img/intro-mot.png);clip-path:inset(-2% 71.5% -2% 14.6%);
  transition:clip-path 1s cubic-bezier(.16,.9,.2,1);}
#intro.texte .il-mot{clip-path:inset(-2% -1% -2% -1%);}
.il-o{position:absolute;inset:0;filter:drop-shadow(0 0 0 rgba(77,166,255,0));transition:filter .6s ease;}
#intro.chaud .il-o{filter:drop-shadow(0 0 12px rgba(77,166,255,.8));}
.il-disque{--m:url(img/intro-disque.png);transform-origin:21.5627% 48.5375%;will-change:transform;transition:opacity .9s ease;
  background:conic-gradient(from var(--a,0deg) at 21.5627% 48.5375%,#2F7DD6,#BFE0FF 10%,#4DA6FF 22%,#1F5FA8 36%,#9CCBFF 52%,#3B8EEA 66%,#E2F1FF 78%,#2F7DD6);}
#intro.refroidi .il-disque{opacity:0;}
.il-dents{--m:url(img/intro-dents.png);transform-origin:21.5627% 48.5375%;will-change:transform;}
.il-engrenage{--m:url(img/intro-engrenage.png);transform-origin:22.5959% 43.4042%;will-change:transform;}
.il-slogan{--m:url(img/intro-slogan.png);background:#8FA2AF;clip-path:inset(0 100% 0 0);
  transition:clip-path 1.1s cubic-bezier(.4,0,.2,1),opacity .3s ease;}
#intro.slogan .il-slogan{clip-path:inset(0 0 0 0);}
.intro-onde{position:absolute;left:21.5627%;top:48.5375%;width:13.9%;aspect-ratio:1;translate:-50% -50%;
  border:2px solid #4DA6FF;border-radius:50%;opacity:0;pointer-events:none;}
#intro.allume .intro-onde{animation:introOnde 1.1s cubic-bezier(.1,.6,.3,1) forwards;}
#intro.allume .intro-onde.deux{animation-delay:.15s;border-width:1px;}
@keyframes introOnde{0%{opacity:.95;transform:scale(1);}100%{opacity:0;transform:scale(4.2);}}
.intro-sous{font-family:var(--f-data);font-weight:500;font-size:clamp(11px,2.9vw,14px);color:#4DA6FF;letter-spacing:.62em;margin-right:-.62em;opacity:0;}
#intro.atelier .intro-sous{animation:introSous 1s cubic-bezier(.2,.8,.2,1) forwards;}
@keyframes introSous{from{opacity:0;letter-spacing:1.5em;margin-right:-1.5em;filter:blur(4px);}to{opacity:1;letter-spacing:.62em;margin-right:-.62em;filter:none;}}
.intro-fin{transition:opacity .3s ease;}
#intro.sortie .intro-fin{opacity:0;}
.intro-passer{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  font-family:var(--f-data);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8FA2AF;
  background:none;border:1px solid #22303A;border-radius:999px;padding:8px 14px;cursor:pointer;opacity:0;animation:introApparait .5s .8s forwards;}
.intro-passer:hover,.intro-passer:focus-visible{color:#fff;border-color:#4DA6FF;outline:none;}
#intro.sortie .intro-passer{visibility:hidden;}
@media (prefers-reduced-motion: reduce){
  #intro{transition:opacity .4s ease;clip-path:none !important;}
  #intro.sortie{opacity:0;}
  .il-logo{opacity:1;transform:none;filter:none;}
  .il-mot,.il-slogan{clip-path:none;}
  .il-disque{opacity:0;}
  .intro-sous{opacity:1;animation:none !important;}
}
</style>
</head>
<body>

<!-- ══════════════════════ CINÉMATIQUE D'OUVERTURE ══════════════════════ -->
<div id="intro" aria-hidden="true">
  <div class="intro-grille"></div>
  <canvas id="introEtincelles"></canvas>
  <div class="intro-flash"></div>
  <div class="intro-scene">
    <div class="il-logo">
      <div class="il-couche il-mot"></div>
      <div class="il-o">
        <div class="il-couche il-disque"></div>
        <div class="il-couche il-dents"></div>
        <div class="il-couche il-engrenage"></div>
      </div>
      <div class="intro-onde"></div><div class="intro-onde deux"></div>
      <div class="il-couche il-slogan intro-fin"></div>
    </div>
    <div class="intro-fin"><div class="intro-sous">ATELIER</div></div>
  </div>
  <button type="button" class="intro-passer">Passer</button>
</div>
<script>
(function () {
    var intro = document.getElementById('intro');
    var root = document.documentElement;
    // une fois par lancement de l'application
    try {
        if (sessionStorage.getItem('intro_vue')) { intro.remove(); return; }
        sessionStorage.setItem('intro_vue', '1');
    } catch (e) { /* stockage indisponible : on joue la cinématique */ }
    root.classList.add('intro-active');

    var reduit = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var logo = intro.querySelector('.il-logo');
    var disque = intro.querySelector('.il-disque');
    var dents = intro.querySelector('.il-dents');
    var engrenage = intro.querySelector('.il-engrenage');
    var canvas = document.getElementById('introEtincelles');
    var ctx = canvas.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = 0, H = 0, fini = false, sortieLancee = false;
    var etincelles = [], timers = [];

    // géométrie de la toile des calques (933 x 240)
    var LAME = { x: 0.215627, y: 0.485375 }, R_O = 64.5 / 933;
    var MOT = { x: 6 / 933, y: 6 / 240, w: 921 / 933, h: 178 / 240 };

    function centreLame() {
        var r = logo.getBoundingClientRect();
        return { x: r.left + LAME.x * r.width, y: r.top + LAME.y * r.height, r: R_O * r.width };
    }
    function dimensionner() {
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W * dpr; canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var c = centreLame();
        intro.style.setProperty('--fx', c.x + 'px');
        intro.style.setProperty('--fy', c.y + 'px');
        if (!sortieLancee) {
            intro.style.setProperty('--cx', c.x + 'px');
            intro.style.setProperty('--cy', c.y + 'px');
        }
    }
    dimensionner();
    window.addEventListener('resize', dimensionner);

    function projeter(x, y, n, force, dir, ecart) {
        for (var i = 0; i < n; i++) {
            var a = dir === undefined ? Math.random() * Math.PI * 2 : dir + (Math.random() - .5) * (ecart || 0.9);
            var v = force * (.45 + Math.random() * .8);
            etincelles.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                vie: 1, duree: 0.35 + Math.random() * 0.8, large: .7 + Math.random() * 1.5 });
        }
    }
    function dessinerEtincelles(dt) {
        ctx.globalCompositeOperation = 'source-over';
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';
        for (var i = etincelles.length - 1; i >= 0; i--) {
            var e = etincelles[i];
            e.vy += 1100 * dt;                 // gravité
            e.vx *= 0.986; e.vy *= 0.986;
            e.x += e.vx * dt; e.y += e.vy * dt;
            e.vie -= dt / e.duree;
            if (e.vie <= 0 || e.y > H + 20) { etincelles.splice(i, 1); continue; }
            // blanc-jaune au départ, orange en refroidissant
            var l = 55 + 40 * e.vie, h = 22 + 30 * e.vie;
            ctx.strokeStyle = 'hsla(' + h + ',100%,' + l + '%,' + Math.min(1, e.vie * 1.4) + ')';
            ctx.lineWidth = e.large * (0.4 + e.vie);
            ctx.beginPath();
            ctx.moveTo(e.x - e.vx * dt * 2, e.y - e.vy * dt * 2);
            ctx.lineTo(e.x, e.y);
            ctx.stroke();
        }
    }

    // Rotation : montée en régime puis arrêt pile sur un nombre entier de
    // tours, pour que la lame et l'engrenage retrouvent la position du logo.
    var T_DEBUT = 200, T_ARRET = 2750, TOURS_LAME = 7, TOURS_ENGRENAGE = -11;
    var lisse = function (p) { return p * p * (3 - 2 * p); };
    var vitesse = function (p) { return 6 * p * (1 - p); };   // dérivée de lisse
    var T_ALLUME = 1350, T_SLOGAN = 2150, T_REFROIDI = 2250, T_ATELIER = 2500,
        T_SORTIE = 3400, T_FIN = 4600;

    function cibleLogo() {
        var cands = document.querySelectorAll('#ecranConnexion .logo-somepre, #ecranApp .logo-somepre');
        for (var i = 0; i < cands.length; i++) {
            var r = cands[i].getBoundingClientRect();
            if (cands[i].offsetParent !== null && r.width > 0 && r.bottom > 0 && r.top < H && r.right > 0 && r.left < W) return r;
        }
        return null;
    }
    function sortir() {
        if (sortieLancee) return;
        sortieLancee = true;
        intro.classList.add('apparait', 'texte', 'refroidi');
        var depart = logo.getBoundingClientRect();
        var cible = reduit ? null : cibleLogo();
        if (cible) {
            // le mot de l'intro vient se poser exactement sur le logo de l'appli
            var s = cible.width / (MOT.w * depart.width);
            logo.style.transformOrigin = '0 0';
            logo.style.transform = 'translate(' + (cible.left - depart.left - s * MOT.x * depart.width) + 'px,'
                + (cible.top - depart.top - s * MOT.y * depart.height) + 'px) scale(' + s + ')';
            intro.style.setProperty('--cx', (cible.left + cible.width / 2) + 'px');
            intro.style.setProperty('--cy', (cible.top + cible.height / 2) + 'px');
            intro.style.setProperty('--rfin', (cible.width * 0.62) + 'px');
        }
        intro.classList.add('sortie');
        timers.push(setTimeout(function () { intro.classList.add('fondu'); }, reduit ? 0 : 780));
        timers.push(setTimeout(terminer, reduit ? 450 : 1080));
    }
    function terminer() {
        if (fini) return;
        fini = true;
        timers.forEach(clearTimeout);
        window.removeEventListener('resize', dimensionner);
        root.classList.remove('intro-active');
        intro.remove();
    }
    intro.addEventListener('click', sortir);
    window.addEventListener('keydown', function k() { window.removeEventListener('keydown', k); sortir(); });

    if (reduit) {
        intro.classList.add('apparait', 'texte', 'slogan', 'atelier');
        timers.push(setTimeout(sortir, 1200));
        return;
    }

    var etapes = [
        [120, 'apparait'], [T_ALLUME, 'allume'], [T_ALLUME, 'texte'], [T_ALLUME - 300, 'chaud'],
        [T_SLOGAN, 'slogan'], [T_ATELIER, 'atelier']
    ];
    etapes.forEach(function (e) { timers.push(setTimeout(function () { intro.classList.add(e[1]); }, e[0])); });
    timers.push(setTimeout(function () {
        var c = centreLame();
        intro.style.setProperty('--fx', c.x + 'px');
        intro.style.setProperty('--fy', c.y + 'px');
        projeter(c.x, c.y, Math.min(150, W / 4), 700);
        if (navigator.vibrate) { try { navigator.vibrate(18); } catch (e) {} }
    }, T_ALLUME));
    timers.push(setTimeout(function () { intro.classList.add('refroidi'); intro.classList.remove('chaud'); }, T_REFROIDI));
    timers.push(setTimeout(sortir, T_SORTIE));
    timers.push(setTimeout(terminer, T_FIN)); // filet de sécurité

    var t0 = performance.now(), avant = t0, reliquat = 0;
    function image(now) {
        if (fini) return;
        var t = now - t0, dt = Math.min(0.05, (now - avant) / 1000);
        avant = now;
        var p = Math.max(0, Math.min(1, (t - T_DEBUT) / (T_ARRET - T_DEBUT)));
        if (sortieLancee) p = 1;
        var aLame = 360 * TOURS_LAME * lisse(p);
        dents.style.transform = disque.style.transform = 'rotate(' + aLame + 'deg)';
        // reflets fixes : le dégradé tourne en sens inverse de la lame
        disque.style.setProperty('--a', (-aLame) + 'deg');
        engrenage.style.transform = 'rotate(' + (360 * TOURS_ENGRENAGE * lisse(p)) + 'deg)';

        // étincelles de découpe, au bas du O, projetées dans le sens de rotation
        var v = vitesse(p);
        if (v > 0.25 && !sortieLancee) {
            var c = centreLame();
            reliquat += v * 420 * dt;
            var n = Math.floor(reliquat); reliquat -= n;
            for (var i = 0; i < n; i++) {
                var phi = Math.PI * (0.48 + Math.random() * 0.16);   // bas du disque
                projeter(c.x + Math.cos(phi) * c.r, c.y + Math.sin(phi) * c.r, 1,
                         (260 + 520 * v) * Math.max(0.6, c.r / 45), phi + Math.PI / 2, 0.7);
            }
        }
        dessinerEtincelles(dt);
        requestAnimationFrame(image);
    }
    requestAnimationFrame(image);
})();
</script>

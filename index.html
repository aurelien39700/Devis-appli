<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04070A">
<title>Suivi d'heures — SOMEPRE</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ==========================================================================
   SUIVI D'HEURES — SOMEPRE · interface v2
   Cette feuille de style et app-v2.js ne portent QUE l'affichage.
   Toute la logique métier reste dans app.js, chargé tel quel.
   ========================================================================== */
:root{
  --ground:#04070A; --panel:#0C1319; --panel-2:#151F27; --panel-3:#1F2C36;
  --line:#33444F; --line-soft:#22303A;
  --ink:#FFFFFF; --ink-mid:#C4D2DC; --ink-dim:#8FA2AF;
  --arc:#4DA6FF; --arc-deep:#1E7FE0; --on-arc:#04121F;
  --arc-soft:rgba(77,166,255,.18); --arc-line:rgba(77,166,255,.62);
  --ok:#2FD07A; --ok-soft:rgba(47,208,122,.18);
  --wait:#B18CFF; --wait-soft:rgba(177,140,255,.18);
  --stop:#FF5E52; --stop-soft:rgba(255,94,82,.18);
  --idle:#8797A2; --idle-soft:rgba(135,151,162,.18);
  --shadow:0 18px 44px -20px rgba(0,0,0,.95);
  --scrim:rgba(2,4,6,.8);
  --f-display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-ui:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-data:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  --rail-w:250px; --rail-w-min:70px;
  --r-sm:4px; --r-md:7px; --r-lg:11px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#E9EDF2; --panel:#FFFFFF; --panel-2:#F2F5F9; --panel-3:#E0E7EE;
    --line:#A7B4C0; --line-soft:#D2DAE3;
    --ink:#06090D; --ink-mid:#37424D; --ink-dim:#55616C;
    --arc:#0A5FC0; --arc-deep:#084A96; --on-arc:#FFFFFF;
    --arc-soft:rgba(10,95,192,.13); --arc-line:rgba(10,95,192,.55);
    --ok:#0B7A42; --ok-soft:rgba(11,122,66,.14);
    --wait:#6A35C9; --wait-soft:rgba(106,53,201,.14);
    --stop:#B01C12; --stop-soft:rgba(176,28,18,.14);
    --idle:#55616C; --idle-soft:rgba(85,97,108,.16);
    --shadow:0 16px 36px -20px rgba(10,20,35,.4);
    --scrim:rgba(233,237,242,.82);
  }
}
:root[data-theme="light"]{
  --ground:#E9EDF2; --panel:#FFFFFF; --panel-2:#F2F5F9; --panel-3:#E0E7EE;
  --line:#A7B4C0; --line-soft:#D2DAE3;
  --ink:#06090D; --ink-mid:#37424D; --ink-dim:#55616C;
  --arc:#0A5FC0; --arc-deep:#084A96; --on-arc:#FFFFFF;
  --arc-soft:rgba(10,95,192,.13); --arc-line:rgba(10,95,192,.55);
  --ok:#0B7A42; --ok-soft:rgba(11,122,66,.14);
  --wait:#6A35C9; --wait-soft:rgba(106,53,201,.14);
  --stop:#B01C12; --stop-soft:rgba(176,28,18,.14);
  --idle:#55616C; --idle-soft:rgba(85,97,108,.16);
  --shadow:0 16px 36px -20px rgba(10,20,35,.4);
  --scrim:rgba(233,237,242,.82);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--f-ui); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,select,textarea{font:inherit;}
:focus-visible{outline:2px solid var(--arc);outline-offset:2px;border-radius:var(--r-sm);}
h1,h2,h3{margin:0;font-family:var(--f-display);text-wrap:balance;letter-spacing:-.02em;}
.eyebrow{font-family:var(--f-data);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums;}
.hidden{display:none !important;}

/* ---------------------------------------------------------------- connexion */
#loginScreen{min-height:100vh;display:grid;place-items:center;padding:24px;}
#loginScreen.hidden{display:none;}
.login{
  width:min(400px,100%);background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:30px;box-shadow:var(--shadow);
}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:26px;text-align:center;}
.login-brand h1{font-size:22px;font-weight:800;}
.mark{flex:none;width:38px;height:38px;border:1.5px solid var(--arc);border-radius:var(--r-sm);display:grid;place-items:center;}
.mark::before{content:'';width:13px;height:13px;background:var(--arc);border-radius:1px;transform:rotate(45deg);box-shadow:0 0 16px var(--arc-line);animation:pulse 3.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:rotate(45deg) scale(1);}50%{opacity:.62;transform:rotate(45deg) scale(.86);}}
.user-types{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:20px;}
.user-type-btn{
  padding:13px;border-radius:var(--r-md);border:1px solid var(--line);
  background:var(--panel-2);color:var(--ink-mid);font-size:13.5px;font-weight:600;
  transition:background .18s,color .18s,border-color .18s;
}
.user-type-btn.active{background:var(--arc-soft);border-color:var(--arc);color:var(--arc);}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:15px;}
.form-group label{font-family:var(--f-data);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);}
.form-group input,.form-group select,.form-group textarea{
  padding:11px 12px;border-radius:var(--r-md);border:1px solid var(--line);
  background:var(--panel-2);color:var(--ink);font-size:14.5px;transition:border-color .18s;
}
.form-group textarea{min-height:74px;resize:vertical;font-family:inherit;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--arc);outline:none;}
.form-group input::placeholder,.form-group textarea::placeholder{color:var(--ink-dim);}
.error-message{
  display:none;margin-top:12px;padding:10px 12px;border-radius:var(--r-md);
  background:var(--stop-soft);border:1px solid var(--stop);color:var(--stop);font-size:13px;
}
.error-message.show{display:block;}

/* ---------------------------------------------------------------- boutons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 15px;border-radius:var(--r-md);font-size:13.5px;font-weight:600;
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink);white-space:nowrap;
  transition:transform .15s,border-color .18s,color .18s,background .18s;
}
.btn:hover{border-color:var(--arc);color:var(--arc);}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--arc);border-color:var(--arc);color:var(--on-arc);}
.btn-primary:hover{background:var(--arc);color:var(--on-arc);filter:brightness(1.1);}
.btn-danger{color:var(--ink);}
.btn-danger:hover{border-color:var(--stop);color:var(--stop);}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.icon-btn{
  flex:none;width:34px;height:34px;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:var(--r-md);
  color:var(--ink-mid);background:var(--panel-2);
  transition:transform .16s,color .18s,border-color .18s;
}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.icon-btn:hover{color:var(--arc);border-color:var(--arc);}
.icon-btn:active{transform:scale(.92);}

/* ---------------------------------------------------------------- ossature */
#appScreen{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .38s cubic-bezier(.4,0,.15,1);}
#appScreen.hidden{display:none;}
#appScreen.is-tight{grid-template-columns:var(--rail-w-min) minmax(0,1fr);}

.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);overflow:hidden;}
.brand{display:flex;align-items:center;gap:12px;padding:19px 17px;border-bottom:1px solid var(--line-soft);min-height:76px;}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:15.5px;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;}
.brand-sub{font-family:var(--f-data);font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--ink-dim);white-space:nowrap;}
.nav{flex:1;overflow-y:auto;padding:14px 0 12px;position:relative;}
.nav-cursor{position:absolute;left:0;width:3px;height:38px;background:var(--arc);border-radius:0 2px 2px 0;box-shadow:0 0 16px var(--arc-line);transition:transform .34s cubic-bezier(.34,1.3,.5,1);pointer-events:none;z-index:2;}
.nav-legend{margin:14px 17px 8px;padding-bottom:7px;border-bottom:1px solid var(--line-soft);white-space:nowrap;overflow:hidden;}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 17px;color:var(--ink-mid);text-align:left;transition:color .18s,background .18s;}
.nav-item svg{flex:none;width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.nav-label{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;transition:opacity .22s;}
.nav-badge{margin-left:auto;font-family:var(--f-data);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--panel-3);color:var(--ink-mid);border:1px solid var(--line);transition:opacity .22s;}
.nav-item:hover{background:var(--panel-2);color:var(--ink);}
.nav-item.is-on{color:var(--ink);background:var(--arc-soft);}
.nav-item.is-on svg{color:var(--arc);}
.nav-item.is-on .nav-badge{background:var(--arc);color:var(--on-arc);}
.rail-foot{border-top:1px solid var(--line-soft);padding:12px 17px 15px;display:flex;flex-direction:column;gap:11px;}
.operator{display:flex;align-items:center;gap:10px;white-space:nowrap;}
.avatar{flex:none;width:29px;height:29px;border-radius:var(--r-sm);background:var(--panel-3);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;}
.operator-name{font-size:13.5px;font-weight:500;line-height:1.2;}
.operator-role{font-family:var(--f-data);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);}
.logout-btn{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-dim);padding:6px 0;white-space:nowrap;transition:color .18s;}
.logout-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.logout-btn:hover{color:var(--stop);}
#appScreen.is-tight .nav-label,#appScreen.is-tight .nav-badge,#appScreen.is-tight .brand-text,
#appScreen.is-tight .operator-meta,#appScreen.is-tight .logout-btn span,#appScreen.is-tight .nav-legend{opacity:0;pointer-events:none;}

.stage{display:flex;flex-direction:column;min-width:0;}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
  padding:0 24px;min-height:76px;
  background:var(--ground);
  background:color-mix(in srgb, var(--ground) 86%, transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.crumb{display:flex;flex-direction:column;gap:2px;min-width:0;}
.crumb h1{font-size:20px;font-weight:700;line-height:1.15;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:13px;}
.clock{text-align:right;padding-right:13px;border-right:1px solid var(--line);line-height:1.25;}
.time-display{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;}
.date-display{font-family:var(--f-data);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-dim);}

/* état de synchronisation (piloté par updateSyncStatus de app.js) */
.sync-status{
  display:flex;align-items:center;gap:8px;
  font-family:var(--f-data);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ok);white-space:nowrap;
}
.sync-status::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;}
.sync-status.offline,.sync-status.error{color:var(--stop);}
.sync-status.saving,.sync-status.syncing{color:var(--arc);}

.views{flex:1;padding:24px;max-width:1400px;width:100%;}
.view{display:none;}
.view.is-on{display:block;animation:rise .45s cubic-bezier(.22,.9,.3,1);}
@keyframes rise{from{opacity:0;transform:translateY(13px);}to{opacity:1;transform:none;}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;min-width:0;margin-bottom:15px;}
.card:last-child{margin-bottom:0;}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.card-head h2{font-size:17px;font-weight:800;letter-spacing:-.025em;}
.grid{display:grid;gap:15px;}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr));}

/* barre d'ajout */
.add-item-form{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px;margin-bottom:16px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-lg);}
.add-item-form input[type=text],.add-item-form input[type=password]{
  flex:1;min-width:150px;padding:9px 12px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13.5px;transition:border-color .18s;
}
.add-item-form input:focus{border-color:var(--arc);outline:none;}
.add-item-form input::placeholder{color:var(--ink-dim);}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-mid);white-space:nowrap;cursor:pointer;}
.check input{width:17px;height:17px;accent-color:var(--arc);cursor:pointer;}

/* statistiques */
.stat{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 16px 15px 20px;display:flex;flex-direction:column;gap:6px;transition:border-color .22s,transform .22s;--c:var(--arc);}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c);}
.stat:hover{border-color:var(--c);transform:translateY(-2px);}
.stat .eyebrow{color:var(--ink-mid);}
.stat-val{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1;color:var(--c);}
.stat-val small{font-size:15px;font-weight:600;opacity:.75;margin-left:2px;}
.stat--ok{--c:var(--ok);} .stat--wait{--c:var(--wait);}
.stat--idle{--c:var(--idle);} .stat--arc{--c:var(--arc);}

/* pastilles */
/* etat : fond plein, lisible d un coup d oeil a distance */
.pill{display:inline-flex;align-items:center;font-family:var(--f-data);font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.pill.en_cours{background:var(--ok);color:var(--on-arc);}
.pill.terminee{background:var(--wait);color:var(--on-arc);}
.pill.archivee{background:var(--idle);color:var(--on-arc);}
.chip-m{flex:none;font-family:var(--f-data);font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 6px;border-radius:3px;background:var(--panel-3);color:var(--ink-mid);border:1px solid var(--line);}

/* heures : information essentielle, donc badge plein */
.badge-h{display:inline-flex;align-items:center;font-family:var(--f-data);font-variant-numeric:tabular-nums;font-weight:700;background:var(--arc);color:var(--on-arc);border-radius:20px;padding:3px 11px;white-space:nowrap;}

/* accès rapide */
.qa-client{margin-bottom:18px;}
.qa-client:last-child{margin-bottom:0;}
.qa-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.qa-head h3{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-size:18px;font-weight:800;letter-spacing:-.03em;color:var(--ink);}
.qa-head h3::before{content:'';flex:none;width:4px;height:17px;background:var(--arc);border-radius:2px;}
.qa-head .rule{flex:1;height:1px;background:var(--line);}
.qa-total{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;background:var(--arc-soft);color:var(--arc);border:1px solid var(--arc);border-radius:20px;padding:2px 11px;}
.qa-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:9px;}
.qa-btn{text-align:left;padding:11px 13px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md);display:flex;flex-direction:column;gap:4px;transition:transform .2s,border-color .2s,background .2s;}
.qa-btn:hover{transform:translateY(-2px);border-color:var(--arc);background:var(--panel-3);}
.qa-top{display:flex;align-items:center;gap:8px;}
.qa-name{font-family:var(--f-display);font-weight:700;font-size:15.5px;letter-spacing:-.015em;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.qa-h{margin-left:auto;font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;background:var(--arc);color:var(--on-arc);border-radius:20px;padding:2px 9px;flex:none;}
.qa-desc{font-size:12px;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:italic;}

/* entrées */
.entry-item{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px;margin-bottom:12px;}
.entry-item:last-child{margin-bottom:0;}
.entry-header{display:flex;align-items:baseline;gap:12px;margin-bottom:4px;}
.entry-client{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:23px;font-weight:800;letter-spacing:-.035em;line-height:1.1;color:var(--ink);}
.entry-client::before{content:'';flex:none;width:5px;height:22px;background:var(--arc);border-radius:3px;}
.entry-hours{margin-left:auto;font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;background:var(--arc);color:var(--on-arc);border-radius:20px;padding:4px 14px;}
.entry-info{font-family:var(--f-display);font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.01em;margin-top:4px;}
.postes-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.poste-chip{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--arc-soft);color:var(--arc);border:1px solid var(--arc);}
.entry-count{font-family:var(--f-data);font-size:11px;color:var(--ink-mid);margin-top:9px;letter-spacing:.06em;}
.details{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);}
.details-lab{font-family:var(--f-data);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:7px;}
.det{display:flex;align-items:center;gap:12px;padding:8px 11px;margin-bottom:5px;background:var(--panel);border-radius:var(--r-md);transition:background .16s;}
.det:last-child{margin-bottom:0;}
.det:hover{background:var(--panel-3);}
.det-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px;}
.det-l1{font-family:var(--f-data);font-size:11.5px;color:var(--ink-mid);font-weight:500;}
.det-l2{font-size:13.5px;font-weight:600;color:var(--ink);}
.det-by{font-family:var(--f-data);font-size:10px;color:var(--ink-dim);}
.det-h{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:700;color:var(--arc);flex:none;}
.det-acts{display:flex;gap:6px;flex:none;}
.empty-state{text-align:center;padding:40px 16px;color:var(--ink-dim);}
.empty-state svg{width:44px;height:44px;stroke:currentColor;fill:none;stroke-width:1.4;opacity:.6;margin-bottom:10px;}

/* barre d'outils affaires */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.search-box{flex:1;min-width:210px;max-width:360px;padding:9px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13.5px;transition:border-color .18s;}
.search-box:focus{border-color:var(--arc);outline:none;}
.search-box::placeholder{color:var(--ink-dim);}
.sel{padding:9px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13.5px;cursor:pointer;transition:border-color .18s;}
.sel:focus{border-color:var(--arc);outline:none;}

/* affaires */
.client-group{margin-bottom:6px;}
.client-group-header{display:flex;align-items:center;gap:11px;margin:20px 0 11px;}
.client-group-title{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:20px;font-weight:800;letter-spacing:-.035em;color:var(--ink);}
.client-group-title::before{content:'';flex:none;width:5px;height:19px;background:var(--arc);border-radius:3px;}
.client-group-count{font-family:var(--f-data);font-size:12px;font-weight:700;color:var(--ink-mid);background:var(--panel-3);border:1px solid var(--line);border-radius:20px;padding:1px 9px;}
.client-group-header .rule{flex:1;height:1px;background:var(--line);}
.affaires-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px;}
.affaire-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:11px;position:relative;transition:border-color .22s,transform .22s;}
.affaire-card:hover{border-color:var(--arc-line);transform:translateY(-2px);}
.affaire-card-header{display:flex;align-items:flex-start;gap:10px;}
.affaire-card-title{font-family:var(--f-display);font-size:18px;font-weight:800;line-height:1.2;letter-spacing:-.025em;}
.affaire-card-description{font-size:13px;color:var(--ink-mid);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.affaire-card-hours{align-self:flex-start;font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;background:var(--arc);color:var(--on-arc);border-radius:20px;padding:3px 12px;}
.affaire-card-actions{display:flex;gap:8px;align-items:center;}
.affaire-card-btn{padding:6px 11px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--panel-2);font-size:12.5px;font-weight:600;transition:border-color .18s,color .18s;}
.affaire-card-btn:hover{border-color:var(--arc);color:var(--arc);}
.affaire-card-btn-primary{flex:1;}
.affaire-card-btn-menu{font-family:var(--f-data);letter-spacing:2px;color:var(--ink-dim);}
.affaire-menu{
  position:absolute;right:14px;top:52px;z-index:10;min-width:176px;padding:5px;
  background:var(--panel-3);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);
  opacity:0;transform:translateY(-6px) scale(.97);pointer-events:none;transition:opacity .19s,transform .19s;
}
.affaire-menu.active{opacity:1;transform:none;pointer-events:auto;}
.affaire-menu-item{padding:8px 10px;border-radius:var(--r-sm);font-size:13px;color:var(--ink-mid);cursor:pointer;transition:background .15s,color .15s;}
.affaire-menu-item:hover{background:var(--panel-2);color:var(--ink);}
.affaire-menu-item.danger:hover{color:var(--stop);}

/* lignes de gestion */
.admin-card{display:flex;align-items:center;gap:14px;padding:13px 15px;margin-bottom:9px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-lg);transition:border-color .2s;}
.admin-card:last-child{margin-bottom:0;}
.admin-card:hover{border-color:var(--arc-line);}
.item-body{flex:1;min-width:0;}
.item-title{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--ink);}
.item-info{font-family:var(--f-data);font-size:11.5px;color:var(--ink-mid);margin-top:3px;letter-spacing:.04em;}
.item-info b{color:var(--arc);font-weight:700;}
.item-actions{display:flex;gap:7px;flex:none;flex-wrap:wrap;justify-content:flex-end;}
.ord{display:flex;flex-direction:column;gap:3px;flex:none;}
.ord button{width:26px;height:19px;display:grid;place-items:center;border:1px solid var(--line);border-radius:3px;color:var(--ink-dim);background:var(--panel);transition:color .16s,border-color .16s;}
.ord button svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.ord button:hover:not(:disabled){color:var(--arc);border-color:var(--arc);}
.ord button:disabled{opacity:.3;cursor:not-allowed;}

/* ---------------------------------------------------------------- modales */
.modal,.affaire-modal{
  position:fixed;inset:0;z-index:60;background:var(--scrim);backdrop-filter:blur(6px);
  display:grid;place-items:center;padding:20px;overflow-y:auto;
  opacity:0;pointer-events:none;transition:opacity .26s;
}
.modal.active,.affaire-modal.active{opacity:1;pointer-events:auto;}
.modal-content,.affaire-modal-content{
  width:min(430px,100%);background:var(--panel);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);overflow:hidden;
  transform:translateY(16px) scale(.97);opacity:0;
  transition:transform .3s cubic-bezier(.24,1.1,.4,1),opacity .26s;
}
.modal.active .modal-content,.affaire-modal.active .affaire-modal-content{transform:none;opacity:1;}
.modal-header,.affaire-modal-header{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);}
.modal-header h2,.affaire-modal-title{font-family:var(--f-display);font-size:16px;font-weight:700;margin:0;}
.modal-close,.affaire-modal-close{margin-left:auto;width:32px;height:32px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--panel-2);color:var(--ink-mid);font-size:19px;line-height:1;transition:color .18s,border-color .18s;}
.modal-close:hover,.affaire-modal-close:hover{color:var(--stop);border-color:var(--stop);}
.modal-body-inner{padding:18px;}
.modal-footer{display:flex;gap:10px;padding:15px 18px;border-top:1px solid var(--line);background:var(--panel-2);}

/* modales injectées par app.js (renommer / supprimer / code) */
.modal-overlay{position:fixed;inset:0;z-index:70;background:var(--scrim);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fade .2s;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal-box{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;animation:pop .28s cubic-bezier(.24,1.1,.4,1);}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97);}to{opacity:1;transform:none;}}
.modal-box .modal-header{padding:16px 18px;}
.modal-box .modal-header h3{font-family:var(--f-display);font-size:16px;font-weight:700;margin:0;}
.modal-box .modal-body{padding:18px;font-size:13.5px;color:var(--ink-mid);}
.modal-box .modal-body p{margin:0 0 10px;}
.modal-box .modal-body p:last-child{margin-bottom:0;}
.modal-box .modal-body strong{color:var(--ink);}
.modal-input{width:100%;margin-top:10px;padding:11px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:14.5px;transition:border-color .18s;}
.modal-input:focus{border-color:var(--arc);outline:none;}
.modal-actions{display:flex;gap:10px;padding:15px 18px;border-top:1px solid var(--line);background:var(--panel-2);}
.modal-actions .btn{flex:1;}

/* bouton flottant */
.floating-btn{
  position:fixed;right:24px;bottom:24px;z-index:40;width:56px;height:56px;border-radius:50%;
  background:var(--arc);color:var(--on-arc);display:grid;place-items:center;
  box-shadow:0 8px 22px -6px var(--arc-line);transition:transform .2s;
  font-size:0;
}
.floating-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;}
.floating-btn:hover{transform:scale(1.07) rotate(90deg);}
.floating-btn:active{transform:scale(.95);}

/* ---------------------------------------------------------------- adaptatif */
@media (max-width:1100px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr));}.g-3{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:820px){
  #appScreen{grid-template-columns:var(--rail-w-min) minmax(0,1fr);}
  #appScreen .nav-label,#appScreen .nav-badge,#appScreen .brand-text,
  #appScreen .operator-meta,#appScreen .logout-btn span,#appScreen .nav-legend{opacity:0;pointer-events:none;}
  .views{padding:16px;}
  .topbar{padding:0 16px;}
  .g-4,.g-3{grid-template-columns:minmax(0,1fr);}
  .clock{display:none;}
  .admin-card{flex-wrap:wrap;}
  .item-actions{width:100%;justify-content:flex-start;}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}

/* ==========================================================================
   TELEPHONE (< 720 px) — ajouts strictement contenus dans ce media query.
   L affichage ordinateur n est pas modifie.
   ========================================================================== */
@media (max-width:720px){

  /* --- le rail devient un tiroir coulissant, ouvert par le bouton menu --- */
  #appScreen{grid-template-columns:minmax(0,1fr);}
  .rail{
    position:fixed;top:0;bottom:0;left:0;
    width:min(280px,84vw);height:100%;
    z-index:70;
    transform:translateX(-100%);
    transition:transform .3s cubic-bezier(.3,.9,.3,1);
    box-shadow:var(--shadow);
    border-right:1px solid var(--line);
  }
  #appScreen.is-tight .rail{transform:none;}
  /* le tiroir affiche les libelles : on annule le repli du bureau */
  #appScreen.is-tight .nav-label,
  #appScreen.is-tight .nav-badge,
  #appScreen.is-tight .brand-text,
  #appScreen.is-tight .operator-meta,
  #appScreen.is-tight .logout-btn span,
  #appScreen.is-tight .nav-legend{opacity:1;pointer-events:auto;}
  /* voile derriere le tiroir */
  #appScreen.is-tight .stage::before{
    content:"";position:fixed;inset:0;z-index:60;background:var(--scrim);
  }
  /* cibles tactiles confortables dans le menu */
  .nav-item{padding:13px 17px;}
  .logout-btn{padding:10px 0;}

  /* --- en-tete --- */
  .topbar{min-height:62px;padding:0 14px;gap:12px;}
  .crumb h1{font-size:17px;}
  .crumb .eyebrow{font-size:9px;}

  /* --- contenu --- */
  .views{padding:14px 14px 96px;}
  .card{padding:14px;border-radius:10px;}
  .card-head{margin-bottom:13px;}
  .card-head h2{font-size:16px;}
  .grid,.g-3,.g-4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .stat{padding:12px 12px 12px 16px;}
  .stat-val{font-size:24px;}

  /* --- acces rapide : une colonne, cible pleine largeur --- */
  .qa-list{grid-template-columns:minmax(0,1fr);}
  .qa-btn{padding:13px;}
  .qa-head h3{font-size:17px;}

  /* --- entrees : le nom du client passe a la ligne avant le total --- */
  .entry-header{flex-wrap:wrap;row-gap:6px;}
  .entry-client{font-size:20px;}
  .entry-hours{font-size:16px;}
  .entry-item{padding:13px;}
  .det{padding:10px;gap:9px;}
  .det-acts .btn{padding:9px 11px;}

  /* --- affaires --- */
  .affaires-grid{grid-template-columns:minmax(0,1fr);}
  .client-group-title{font-size:18px;}
  .toolbar{gap:8px;}
  .search-box{max-width:none;min-width:0;flex:1 1 100%;}
  .toolbar .sel{flex:1 1 calc(50% - 4px);min-width:0;}
  .toolbar .btn-primary{flex:1 1 100%;margin-left:0 !important;}
  .affaire-menu{right:10px;left:10px;top:auto;bottom:56px;min-width:0;}

  /* --- lignes de gestion : actions sur toute la largeur --- */
  .admin-card{flex-wrap:wrap;padding:13px;}
  .item-actions{width:100%;justify-content:stretch;gap:8px;}
  .item-actions .btn{flex:1;padding:10px 8px;}
  .ord{flex-direction:row;gap:6px;}
  .ord button{width:38px;height:32px;}
  .add-item-form{padding:12px;gap:8px;}
  .add-item-form input{flex:1 1 100%;}
  .add-item-form .btn{flex:1 1 100%;}

  /* --- formulaires : 16 px evite le zoom automatique sur iOS --- */
  .form-group input,.form-group select,.form-group textarea,
  .search-box,.sel,.add-item-form input,.modal-input{font-size:16px;}
  .form-group input,.form-group select{padding:13px 12px;}

  /* --- modales en feuille basse, atteignable au pouce --- */
  .modal,.affaire-modal,.modal-overlay{
    place-items:end center;padding:0;
  }
  .modal-content,.affaire-modal-content,.modal-box{
    width:100%;max-width:none;
    border-radius:16px 16px 0 0;
    max-height:92vh;display:flex;flex-direction:column;
  }
  .modal-body-inner,.modal-box .modal-body{overflow-y:auto;}
  .modal-footer,.modal-actions{
    padding-bottom:calc(15px + env(safe-area-inset-bottom));
  }
  .modal-footer .btn,.modal-actions .btn{padding:13px 15px;}

  /* --- bouton flottant --- */
  .floating-btn{
    right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
    width:58px;height:58px;
  }

  /* --- connexion --- */
  #loginScreen{padding:16px;}
  .login{padding:22px;border-radius:12px;}
  .user-type-btn{padding:15px;}
}

/* --- tres petits ecrans --- */
@media (max-width:400px){
  .grid,.g-3,.g-4{grid-template-columns:minmax(0,1fr);}
  .entry-client{font-size:18px;}
  .toolbar .sel{flex:1 1 100%;}
}

</style>
</head>
<body>

<!-- ══════════════════════ CONNEXION ══════════════════════ -->
<div id="loginScreen">
  <div class="login">
    <div class="login-brand">
      <div class="mark"></div>
      <h1>Suivi d'heures</h1>
      <div class="eyebrow">Somepre</div>
    </div>
    <div class="user-types">
      <button type="button" class="user-type-btn active" data-type="user">Utilisateur</button>
      <button type="button" class="user-type-btn" data-type="admin">Admin</button>
    </div>
    <form id="loginForm">
      <div class="form-group" id="userSelectGroup">
        <label for="userSelect">Votre nom</label>
        <select id="userSelect"><option value="">Sélectionner votre nom</option></select>
      </div>
      <div class="form-group">
        <label for="accessCode">Mot de passe</label>
        <input type="password" id="accessCode" placeholder="Entrez votre mot de passe" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:13px;">Se connecter</button>
      <div class="error-message" id="errorMessage"></div>
    </form>
  </div>
</div>

<!-- ══════════════════════ APPLICATION ══════════════════════ -->
<div id="appScreen" class="hidden">

  <aside class="rail">
    <div class="brand">
      <div class="mark"></div>
      <div class="brand-text">
        <div class="brand-name">Suivi d'heures</div>
        <div class="brand-sub">Somepre</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-cursor" id="navCursor"></div>

      <div class="nav-legend eyebrow">Saisie</div>
      <button class="nav-item is-on" data-view="hours">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span class="nav-label">Heures</span>
      </button>

      <div id="managementTabBtn" style="display:none;">
        <div class="nav-legend eyebrow">Gestion</div>
        <button class="nav-item" data-view="clients">
          <svg viewBox="0 0 24 24"><path d="M3 21V8l6-4 6 4v13"/><path d="M15 21V11l6 3v7"/><path d="M8 21v-5h3v5"/></svg>
          <span class="nav-label">Clients</span><span class="nav-badge" id="badgeClients">0</span>
        </button>
        <button class="nav-item" data-view="affaires">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span class="nav-label">Affaires</span><span class="nav-badge" id="badgeAffaires">0</span>
        </button>
        <button class="nav-item" data-view="postes">
          <svg viewBox="0 0 24 24"><path d="M5 4v16M12 4v16M19 4v16"/><rect x="2" y="8" width="6" height="4" rx="1"/><rect x="9" y="13" width="6" height="4" rx="1"/><rect x="16" y="6" width="6" height="4" rx="1"/></svg>
          <span class="nav-label">Postes</span><span class="nav-badge" id="badgePostes">0</span>
        </button>
        <button class="nav-item" data-view="users">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.5a3 3 0 0 1 0 5.6M17 20a6 6 0 0 0-1.6-4"/></svg>
          <span class="nav-label">Utilisateurs</span><span class="nav-badge" id="badgeUsers">0</span>
        </button>
      </div>

      <div id="devisNavGroup" style="display:none;">
        <div class="nav-legend eyebrow">Outil</div>
        <button class="nav-item" id="devisAppBtn" onclick="ouvrirDevisApp()">
          <svg viewBox="0 0 24 24"><path d="M6 3h8l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
          <span class="nav-label">Devis</span>
        </button>
      </div>
    </nav>

    <div class="rail-foot">
      <div class="sync-status" id="syncStatus">Synchronisé</div>
      <div class="operator">
        <div class="avatar" id="userIcon">👤</div>
        <div class="operator-meta">
          <div class="operator-name" id="userType">Utilisateur</div>
          <div class="operator-role" id="userRoleLabel">Connecté</div>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span>Déconnexion</span>
      </button>
    </div>
  </aside>

  <div class="stage">
    <header class="topbar">
      <button class="icon-btn" id="tightBtn" title="Replier le menu" aria-label="Replier le menu">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="crumb">
        <div class="eyebrow" id="crumbTop">Saisie</div>
        <h1 id="crumbMain">Heures</h1>
      </div>
      <div class="topbar-right">
        <div class="clock">
          <div class="time-display">--:--:--</div>
          <div class="date-display">--/--/----</div>
        </div>
        <button class="icon-btn" id="themeBtn" title="Basculer le thème" aria-label="Basculer le thème">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
        </button>
      </div>
    </header>

    <main class="views">

      <!-- Heures -->
      <section class="view is-on" data-view="hours">
        <div class="card" id="quickAccessCard" style="display:none;">
          <div class="card-head"><h2>Affaires en cours</h2>
            <span class="eyebrow" style="margin-left:auto;">Cliquer pour saisir</span></div>
          <div id="quickAccessAffaires"></div>
        </div>
        <div class="card">
          <div class="card-head"><h2>Liste des entrées</h2>
            <span class="eyebrow" id="entriesScope" style="margin-left:auto;"></span></div>
          <div id="entriesList"></div>
        </div>
      </section>

      <!-- Clients -->
      <section class="view" data-view="clients">
        <div class="add-item-form">
          <input type="text" id="newClient" placeholder="Nom du client">
          <button class="btn btn-primary" onclick="addClient()">Ajouter un client</button>
        </div>
        <div id="clientsList"></div>
      </section>

      <!-- Affaires -->
      <section class="view" data-view="affaires">
        <div class="grid g-4" id="affairesStats" style="margin-bottom:16px;"></div>
        <div class="toolbar">
          <input type="text" id="searchAffaires" class="search-box" placeholder="Rechercher une affaire ou un client">
          <select id="filterStatut" class="sel" onchange="filterAffaires(this.value)">
            <option value="all">Toutes</option>
            <option value="en_cours" selected>En cours</option>
            <option value="terminee">Terminées</option>
            <option value="archivee">Archivées</option>
          </select>
          <select id="sortAffaires" class="sel" onchange="renderAffaires()">
            <option value="recent">Plus récentes</option>
            <option value="name">Nom A-Z</option>
            <option value="hours">Plus d'heures</option>
          </select>
          <button class="btn btn-primary" onclick="openAffaireModal()" style="margin-left:auto;">Nouvelle affaire</button>
        </div>
        <div id="affairesList"></div>
      </section>

      <!-- Postes -->
      <section class="view" data-view="postes">
        <div class="add-item-form">
          <input type="text" id="newPoste" placeholder="Nom du poste">
          <label class="check"><input type="checkbox" id="newPosteMachine"><span>Temps machine</span></label>
          <button class="btn btn-primary" onclick="addPoste()">Ajouter un poste</button>
        </div>
        <div id="postesList"></div>
      </section>

      <!-- Utilisateurs -->
      <section class="view" data-view="users">
        <div class="add-item-form">
          <input type="text" id="newUserName" placeholder="Nom de l'utilisateur">
          <input type="password" id="newUserPassword" placeholder="Mot de passe">
          <button class="btn btn-primary" onclick="addUser()">Ajouter un utilisateur</button>
        </div>
        <div id="usersList"></div>
      </section>

    </main>
  </div>
</div>

<!-- bouton flottant : ajouter une entrée -->
<button class="floating-btn" onclick="openModal()" title="Ajouter une entrée" id="addBtn" style="display:none;">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- ══════════════════════ MODALE : ENTRÉE ══════════════════════ -->
<div id="modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">Nouvelle entrée</h2>
      <button type="button" class="modal-close" id="modalCloseBtn" aria-label="Fermer">×</button>
    </div>
    <form id="entryForm">
      <div class="modal-body-inner">
        <div class="form-group">
          <label for="client">Client</label>
          <select id="client" required><option value="">Sélectionner un client</option></select>
        </div>
        <div class="form-group">
          <label for="affaire">Affaire</label>
          <select id="affaire" required><option value="">Sélectionner d'abord un client</option></select>
        </div>
        <div id="newAffaireGroup" style="display:none;">
          <div class="form-group">
            <label for="newAffaireName">Nom de la nouvelle affaire</label>
            <input type="text" id="newAffaireName" placeholder="Ex : 3081">
          </div>
          <div class="form-group">
            <label for="newAffaireDesc">Description</label>
            <textarea id="newAffaireDesc" placeholder="Travaux à réaliser (optionnel)"></textarea>
          </div>
        </div>
        <div class="form-group">
          <label for="poste">Poste</label>
          <select id="poste" required><option value="">Sélectionner un poste</option></select>
        </div>
        <div class="form-group">
          <label for="hours">Heures</label>
          <input type="number" id="hours" step="0.25" min="0" placeholder="0" required>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="modalCancelBtn" style="flex:1;">Annuler</button>
        <button type="submit" class="btn btn-primary" style="flex:2;"><span id="submitBtnText">Ajouter</span></button>
      </div>
    </form>
  </div>
</div>

<!-- ══════════════════════ MODALE : AFFAIRE ══════════════════════ -->
<div id="affaireModal" class="affaire-modal">
  <div class="affaire-modal-content">
    <div class="affaire-modal-header">
      <h3 class="affaire-modal-title" id="affaireModalTitle">Nouvelle affaire</h3>
      <button class="affaire-modal-close" onclick="closeAffaireModal()" aria-label="Fermer">×</button>
    </div>
    <form id="affaireForm" onsubmit="saveAffaire(event)">
      <div class="modal-body-inner">
        <input type="hidden" id="affaireModalId">
        <div class="form-group">
          <label for="affaireModalClient">Client *</label>
          <select id="affaireModalClient" required><option value="">Sélectionner un client</option></select>
        </div>
        <div class="form-group">
          <label for="affaireModalName">Nom de l'affaire *</label>
          <input type="text" id="affaireModalName" placeholder="Ex : MD1178, 3075..." required>
        </div>
        <div class="form-group">
          <label for="affaireModalDescription">Description</label>
          <textarea id="affaireModalDescription" placeholder="Description des travaux à réaliser (optionnel)"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeAffaireModal()" style="flex:1;">Annuler</button>
        <button type="submit" class="btn btn-primary" style="flex:2;"><span id="affaireModalSubmitText">Créer</span></button>
      </div>
    </form>
  </div>
</div>

<!-- conteneur des modales injectées par app.js -->
<div id="modalContainer"></div>
